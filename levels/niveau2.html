function dodo(ms) { return new Promise(r => setTimeout(r, ms)); }

function annoncer(txt, dur = 1800) {
  return new Promise(res => {
    const el = document.getElementById('annonce');
    el.textContent = txt;
    el.style.opacity = 1;
    setTimeout(() => { el.style.opacity = 0; setTimeout(res, 300); }, dur);

function tipBubble(title, body, dur = 3400) {
  const stack = document.getElementById('tip-stack');
  const el = document.createElement('div');
  el.className = 'tip-bubble';
  el.innerHTML = `<strong>${title}</strong>${body}`;
  stack.appendChild(el);
  while (stack.children.length > 4) stack.removeChild(stack.firstChild);
  setTimeout(() => {
    el.classList.add('fade-out');
    setTimeout(() => el.remove(), 380);
  }, dur);
}

function clearTipBubbles() {
  document.getElementById('tip-stack').replaceChildren();
}

function log(txt) {
  return new Promise(res => {
    narrResolve = res;
    narrActive = true;
    document.getElementById('journal-text').textContent = txt;
    document.getElementById('journal').style.display = 'block';
    updateGamepadVisibility();
  });
}

function hideLog() {
  document.getElementById('journal').style.display = 'none';
  narrActive = false;
  updateGamepadVisibility();
}

function snapToGround() {
  const p = playerState;
  p.x = START.x;
  p.y = GROUND_Y - PH;
  p.vx = 0;
  p.vy = 0;
  p.onGround = true;
  p.jumps = 0;
  p.hitWall = 0;
}

function savePlayerPos() {
  savedPos = {
    x: playerState.x, y: playerState.y,
    vx: 0, vy: 0,
  };
}

function restorePlayerPos() {
  if (!savedPos) return;
  const p = playerState;
  p.x = savedPos.x;
  p.y = savedPos.y;
  p.vx = 0;
  p.vy = 0;
  p.jumps = 0;
  p.onGround = false;
  p.vy = 0.01;
  snapPlayerToPlatforms(p);
  if (!p.onGround) {
    for (const pl of platforms) {
      if (pl.broken || pl.type === 'spike' || pl.type === 'wall' || pl.type === 'gate') continue;
      if (p.x + PW > pl.x && p.x < pl.x + pl.w && Math.abs(p.y + PH - pl.y) < 14) {
        p.y = pl.y - PH;
        p.onGround = true;
        break;
      }
    }
  }
  savedPos = null;
}

function applyNarrSeenToTriggers() {
  for (const t of triggers) {
    if (narrSeen.has(t.id) && t.id !== 'temple') t.fired = true;

function markTriggerFired(id) {
  for (const t of triggers) {

function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain();
  master.gain.value = 0.45;
  master.connect(actx.destination);
}

function sonCriDoom() {
  initAudio();
  const t0 = actx.currentTime;
  [55, 82.5, 110].forEach((f, i) => {
    const o = actx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f, t0);
    o.frequency.exponentialRampToValueAtTime(f * 0.6, t0 + 0.35);
    const ws = actx.createWaveShaper();
    const n = 128, curve = new Float32Array(n);
    for (let j = 0; j < n; j++) {
      const x = j / n * 2 - 1;
      curve[j] = Math.tanh(x * 6) / Math.tanh(2);
    }
    ws.curve = curve;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.18 - i * 0.04, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
    o.connect(ws); ws.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + 0.55);
  });
  const buf = actx.createBuffer(1, actx.sampleRate * 0.15, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const noise = actx.createBufferSource();
  noise.buffer = buf;
  const nf = actx.createBiquadFilter();
  nf.type = 'lowpass'; nf.frequency.value = 400;
  const ng = actx.createGain();
  ng.gain.setValueAtTime(0.12, t0);
  ng.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
  noise.connect(nf); nf.connect(ng); ng.connect(master);
  noise.start(t0);
}

const NARRATIONS = {
  intro: "Somnul dérive dans le monde des songes, propulsé sans fin. Les reliques le ralentissent - sans torpeur, le rêve broie tout.",
  bridge: "Dalles instables : trop vite, et elles s'effondrent.",
  cerberus: "CERBERUS garde le seuil. Trois gueules de brume - deux cris doom par tête pour les terrasser.",
};

async function fireTrigger(id) {
  if (phase === 'fin') return;

  if (id === 'temple') {
    markTriggerFired(id);
    startTempleEntry();
    return;
  }

  if (!NARRATIONS[id]) return;

  markTriggerFired(id);

  if (narrSeen.has(id)) {
    phase = 'play';
    return;
  }

  savePlayerPos();
  phase = 'narration';
  narrSeen.add(id);
  await log(NARRATIONS[id]);
  restorePlayerPos();
  invulnTimer = 1.5;
  phase = 'play';
}

function startTempleEntry() {
  if (templeSeq || phase === 'fin' || !temple) return;
  narrSeen.add('temple');
  phase = 'temple';
  const p = playerState;
  templeSeq = {
    phase: 'approach',
    t: 0,
    alpha: 1,
    startX: p.x,
    startY: p.y,
    doorX: temple.doorX - PW / 2,
    doorY: temple.doorY - PH,
    climbFrom: null,
    burstDone: false,
  };
  p.vx = 0;
  p.vy = 0;
  p.facing = 1;
  p.onGround = true;
  temple.glow = 0;
  updateGamepadVisibility();
}

function updateTempleSequence(dt) {
  const seq = templeSeq;
  if (!seq || !temple) return;
  const p = playerState;
  seq.t += dt;

  if (seq.phase === 'approach') {
    const prog = Math.min(1, seq.t / TEMPLE_SEQ.APPROACH);
    const e = prog * prog * (3 - 2 * prog);
    p.x = seq.startX + (seq.doorX - seq.startX) * e;
    p.y = seq.startY;
    p.anim = 'walk';
    p.animFrame += dt * 5;
    p.facing = 1;
    temple.glow = prog * 0.45;
    camShake = prog * 3;
    if (Math.random() < 0.35) {
      spawnParticles(temple.doorX, temple.doorY, COL.glow, 1);
    }
    if (prog >= 1) {
      seq.phase = 'climb';
      seq.t = 0;
      seq.climbFrom = { x: p.x, y: p.y };
    }
  } else if (seq.phase === 'climb') {
    const prog = Math.min(1, seq.t / TEMPLE_SEQ.CLIMB);
    const e = prog * prog * (3 - 2 * prog);
    const sway = Math.sin(prog * Math.PI) * 6;
    p.x = seq.climbFrom.x + (seq.doorX - seq.climbFrom.x) * e + sway;
    p.y = seq.climbFrom.y + (seq.doorY - seq.climbFrom.y + 10) * e;
    p.pipeScale = 1 - e * 0.12;
    p.anim = 'walk';
    p.animFrame += dt * 6;
    temple.glow = 0.45 + e * 0.45;
    camShake = 4 + e * 6;
    if (Math.random() < 0.5) {
      spawnParticles(temple.doorX + (Math.random() - 0.5) * 16, temple.doorY - prog * 20, COL.eye, 1);
    }
    if (prog >= 1) {
      seq.phase = 'absorb';
      seq.t = 0;
    }
  } else if (seq.phase === 'absorb') {
    const prog = Math.min(1, seq.t / TEMPLE_SEQ.ABSORB);
    const e = prog * prog;
    p.x = seq.doorX + Math.sin(prog * 14) * (1 - prog) * 5;
    p.y = seq.doorY - prog * 28;
    p.pipeScale = 0.88 - prog * 0.72;
    p.pipeRot = prog * Math.PI * 4;
    p.anim = 'pipe';
    seq.alpha = 1 - e * 0.96;
    temple.glow = 0.9 + prog * 0.6;
    distortAmt = Math.max(distortAmt, prog * 0.65);
    camShake = 8 + prog * 10;
    if (Math.random() < 0.65) {
      spawnParticles(temple.doorX, temple.doorY - prog * 24, COL.glow, 2);
    }
    if (prog >= 1) {
      seq.phase = 'burst';
      seq.t = 0;
      p.pipeScale = 0.05;
      seq.alpha = 0;
    }
  } else if (seq.phase === 'burst') {
    temple.glow = 1.4 - seq.t * 2;
    camShake = Math.max(0, 22 - seq.t * 35);
    attackFlash = Math.max(attackFlash, 0.55 - seq.t * 0.8);
    if (!seq.burstDone) {
      seq.burstDone = true;
      flasher('#bfffc8', 0.65);
      spawnParticles(temple.doorX, temple.doorY - 18, COL.eye, 36);
      spawnParticles(temple.doorX, temple.doorY - 18, COL.glow, 24);
    }
    if (seq.t >= TEMPLE_SEQ.BURST) {
      templeSeq = null;
      temple.glow = 0;
      victoire();
    }
  }
}

function resetLevel(fromDeath = false) {
  buildLevel();
  applyNarrSeenToTriggers();
  Object.assign(playerState, {
    x: START.x, y: GROUND_Y - PH, vx: 0, vy: 0,
    onGround: true, jumps: 0, facing: 1,
    anim: 'idle', animFrame: 0, hitWall: 0, screaming: 0,
    pipeScale: 1, pipeRot: 0,
  });
  slowBuff = { mult: 1, timer: 0, timeMax: 0, label: '' };
  particles = [];
  attackFlash = 0;
  invulnTimer = 1.5;
  savedPos = null;
  attackTimer = 0;
  camShake = 0;
  distortAmt = 0;
  shockwaves = [];
  bossProjectiles = [];
  templeSeq = null;
  if (temple) temple.glow = 0;
  clearTipBubbles();
  if (!fromDeath) phase = 'play';
}

function die() {
  if (phase === 'death' || phase === 'fin') return;
  const p = playerState;
  flasher('#5a2038', 0.5);
  camShake = 10;

  const particles = [];
  for (let i = 0; i < 36; i++) {
    particles.push({
      x: p.x + PW * 0.15 + Math.random() * PW * 0.7,
      y: p.y + Math.random() * PH,
      vx: (Math.random() - 0.5) * 2.8,
      vy: -1.4 - Math.random() * 3.2,
      life: 0.55 + Math.random() * 0.85,
      maxLife: 1.35,
      color: Math.random() > 0.45 ? COL.glow : (Math.random() > 0.5 ? COL.eye : '#7ab890'),
      size: 1 + Math.random() * 3,
    });
  }

  deathSeq = {
    phase: 'dissolve',
    t: 0,
    fade: 0,
    x: p.x,
    y: p.y,
    facing: p.facing,
    particles,
    rings: [{ r: 6, a: 0.7 }, { r: 2, a: 0.5 }],
  };
  phase = 'death';
}

function updateDeathSequence(dt) {
  const s = deathSeq;
  if (!s) return;

  camShake *= 0.88;

  if (s.phase === 'dissolve') {
    s.t += dt;
    for (const pt of s.particles) {
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vy -= dt * 0.35;
      pt.life -= dt;
    }
    s.particles = s.particles.filter(pt => pt.life > 0);
    for (const ring of s.rings) ring.r += dt * 38;
    if (s.t >= DEATH_SEQ.DISSOLVE) {
      s.phase = 'blackout';
      s.t = 0;
    }
  } else if (s.phase === 'blackout') {
    s.t += dt;
    s.fade = Math.min(1, s.t / DEATH_SEQ.FADE_OUT);
    if (s.t >= DEATH_SEQ.FADE_OUT) {
      resetLevel(true);
      s.phase = 'fadein';
      phase = 'death';
      s.t = 0;
    }
  } else if (s.phase === 'fadein') {
    s.t += dt;
    s.fade = Math.max(0, 1 - s.t / DEATH_SEQ.FADE_IN);
    if (s.t >= DEATH_SEQ.FADE_IN) {
      deathSeq = null;
      phase = 'play';
    }
  }

  updateDeathCamera();
}

function updateDeathCamera() {
  const s = deathSeq;
  if (!s) return;
  const useStart = s.phase === 'fadein';
  const cx = (useStart ? playerState.x : s.x) + PW / 2;
  const cy = (useStart ? playerState.y : s.y) + PH / 2;
  const shake = s.phase === 'dissolve' ? (Math.random() - 0.5) * camShake * 0.3 : 0;
  cam.x = cx - VW / 2 + shake;
  cam.y = cy - VH / 2 + shake * 0.5;
  cam.x = Math.max(0, Math.min(cam.x, levelW - VW));
  cam.y = Math.max(-40, Math.min(cam.y, 168 - VH + 60));
}

function drawDeathSomnul(x, y, prog, facing) {
  const lift = -prog * 24;
  const alpha = 1 - prog * 0.94;
  const slump = prog * 0.42;
  const eyePow = Math.max(0, 1 - prog * 1.35);
  const mist = prog * 0.55;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x + PW * 0.45, y + PH + lift);
  ctx.scale(facing, 1);
  ctx.rotate(slump);

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(0, 4, 12 - prog * 8, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = COL.fur;
  ctx.beginPath();
  ctx.ellipse(-2, -18, 15, 19, -0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = COL.belly;
  ctx.beginPath();
  ctx.ellipse(-6, -16, 9, 13, -0.15, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#2e261c';
  ctx.fillRect(-2, -4, 5, 8);
  ctx.fillRect(3, -2 + prog * 4, 5, 7);

  ctx.save();
  ctx.translate(4, -22);
  ctx.rotate(0.55 + prog * 0.5);
  ctx.fillStyle = COL.fur;
  ctx.fillRect(-3, 0, 7, 14);
  ctx.restore();

  ctx.save();
  ctx.translate(-4, -28 + prog * 3);
  ctx.rotate(-0.25 - prog * 0.35);
  ctx.fillStyle = COL.furL;
  ctx.beginPath();
  ctx.ellipse(0, 0, 11, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = COL.fur;
  ctx.beginPath();
  ctx.ellipse(1, 1, 9, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#0a0e08';
  ctx.fillRect(-1, -2, 5, eyePow > 0.15 ? 3 : 1);
  if (eyePow > 0.08) {
    ctx.fillStyle = COL.eye;
    ctx.globalAlpha = alpha * eyePow;
    ctx.shadowColor = COL.eyeGlow;
    ctx.shadowBlur = 8 * eyePow;
    ctx.fillRect(0, -2, 3, 2);
    ctx.shadowBlur = 0;
  }
  ctx.restore();

  if (mist > 0.05) {
    ctx.globalAlpha = alpha * mist * 0.45;
    ctx.fillStyle = COL.glow;
    for (let i = 0; i < 5; i++) {
      const a = animT * 3 + i * 1.3;
      ctx.fillRect(-16 + Math.cos(a) * 10, -30 + Math.sin(a) * 8, 2, 2);
    }
  }

  ctx.restore();
}

function drawDeathEffects() {
  const s = deathSeq;
  if (!s || s.phase !== 'dissolve') return;

  const prog = Math.min(1, s.t / DEATH_SEQ.DISSOLVE);
  const cx = s.x + PW / 2 - cam.x;
  const cy = s.y + PH * 0.4 - cam.y - prog * 24;

  for (const ring of s.rings) {
    const a = ring.a * (1 - prog);
    ctx.strokeStyle = `rgba(74,255,138,${a * 0.35})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, ring.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(138,184,144,${a * 0.18})`;
    ctx.beginPath();
    ctx.arc(cx, cy, ring.r * 0.72, 0, Math.PI * 2);
    ctx.stroke();
  }

  for (const pt of s.particles) {
    const a = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = a * 0.85;
    ctx.fillRect(pt.x - cam.x, pt.y - cam.y, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;

  const vign = prog * 0.35;
  if (vign > 0.02) {
    const g = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.2, VW / 2, VH / 2, VH * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, `rgba(8,4,12,${vign})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);
  }
}

function drawDeathFade() {
  if (!deathSeq || deathSeq.fade <= 0) return;
  ctx.fillStyle = `rgba(0,0,0,${deathSeq.fade})`;
  ctx.fillRect(0, 0, VW, VH);
}

function dreamPull() {
  return slowBuff.timer > 0 ? PULL * slowBuff.mult : PULL;
}

function moveControl() {

function currentSpeed() {
  const pull = dreamPull();
  const vx = Math.abs(playerState.vx);
  return vx + pull * ONIRIC_PULL_W;
}

function spawnParticles(x, y, color, n) {

    particles.push({
      x, y, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
      life: 0.6 + Math.random() * 0.4, color, size: 2 + Math.random() * 2,
    });
  }
}

function spawnShockwaves() {
  const px = playerState.x + PW * 0.65 * playerState.facing;
  const py = playerState.y + PH * 0.38;
  shockwaves = [];
  for (let i = 0; i < 6; i++) {
    shockwaves.push({
      x: px, y: py,
      r: 6 + i * 4,
      maxR: ATTACK.RANGE * (0.55 + i * 0.12),
      life: 1,
      speed: 280 + i * 55,
      delay: i * 0.04,
      alpha: 0.85 - i * 0.1,
    });
  }
}

function updateShockwaves(dt) {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const w = shockwaves[i];
    w.delay -= dt;
    if (w.delay > 0) continue;
    w.r += w.speed * dt;
    w.life -= dt * 0.9;
    if (w.life <= 0 || w.r > w.maxR) shockwaves.splice(i, 1);
  }
}

const CERBERUS_ATK = {
  IDLE: 2.0, WINDUP: 0.58, ROAR: 0.42, LUNGE: 0.34, RECOVER: 2.4, HIT_PAUSE: 1.15,
  PATROL: 58, LUNGE_SPD: 34,
};
const CERBERUS_ENRAGE_LIVES = 1.5;

function cerberusLives(e) {
  return e.headHp.reduce((s, h) => s + h, 0) / 2;
}

function cerberusEnraged(e) {
  return cerberusLives(e) <= CERBERUS_ENRAGE_LIVES;
}

function cerberusHeadAlive(e, i) {
  return e.headHp[i] > 0;
}

function cerberusAnyHeadAlive(e) {
  return e.headHp.some(hp => hp > 0);
}

function cerberusDamageHead(e) {
  for (let i = 0; i < e.headHp.length; i++) {
    if (e.headHp[i] > 0) {
      e.headHp[i]--;
      return i;
    }
  }
  return -1;
}

function killEnemiesInRange() {
  const cx = playerState.x + PW / 2;
  const cy = playerState.y + PH / 2;
  for (const e of enemies) {
    if (!e.alive) continue;
    const ex = e.x + e.w / 2;
    const ey = e.y + e.h / 2;
    if (Math.hypot(ex - cx, ey - cy) > ATTACK.RANGE) continue;
    if (e.type === 'cerberus') {
      if (e.hurtTimer > 0) continue;
      const headIdx = cerberusDamageHead(e);
      if (headIdx < 0) continue;
      e.hurtTimer = 0.55;
      e.hitFlash = 0.45;
      e.atkPhase = 'idle';
      e.atkTimer = CERBERUS_ATK.HIT_PAUSE;
      camShake = 10;
      const hx = e.x + [14, 36, 58][headIdx];
      spawnParticles(hx, e.y + 6, '#ff6a6a', 12);
      spawnParticles(hx, e.y + 10, COL.enemyEye, 8);
      if (!cerberusAnyHeadAlive(e)) {
        e.alive = false;
        spawnParticles(e.x + e.w / 2, e.y + 10, COL.glow, 28);
        spawnParticles(e.x + e.w / 2, e.y + 10, '#aa4a4a', 18);
        flasher('#ff6a6a', 0.35);
      }
      continue;
    }
    e.alive = false;
    spawnParticles(ex, ey, COL.enemyEye, 22);
    spawnParticles(ex, ey, COL.glow, 8);
  }
}

function frameStep(dt) {
  return dt / TICK;
}

function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function platformBlocksSide(p, pl) {
  if (!aabb(p.x, p.y, PW, PH, pl.x, pl.y, pl.w, pl.h)) return false;
  const feet = p.y + PH;
  const platTop = pl.y;
  const cx = p.x + PW / 2;

  // Debout sur la dalle - pas un mur
  if (Math.abs(feet - platTop) <= 10 && cx >= pl.x + 2 && cx <= pl.x + pl.w - 2) return false;

  // Saut vers le haut - laisser monter (escaliers, ponts)
  if (p.vy < -0.8 && feet > platTop + 1) return false;

  return true;
}

function isLandingOn(pl, p, prevBottom) {
  if (p.vy < 0) return false;
  return prevBottom <= pl.y + 10 && p.y + PH >= pl.y - 4;
}

function snapPlayerToPlatforms(p) {
  let best = null;
  const prevBottom = p.y + PH - p.vy;
  for (const pl of platforms) {
    if (pl.broken || pl.type === 'wall' || pl.type === 'spike') continue;
    if (pl.type === 'gate' && currentSpeed() > SLOW_THRESH) continue;
    if (!aabb(p.x, p.y, PW, PH, pl.x, pl.y, pl.w, pl.h)) continue;

    if (isLandingOn(pl, p, prevBottom)) {
      if (!best || pl.y < best.y) best = pl;
    } else if (p.vy < 0) {
      const prevTop = p.y - p.vy;
      const cx = p.x + PW / 2;
      if (cx >= pl.x + 2 && cx <= pl.x + pl.w - 2
          && prevTop <= pl.y + pl.h + 4 && p.y <= pl.y + pl.h) {
        p.y = pl.y + pl.h;
        p.vy = 0;
      }
    }
  }
  if (best) {
    p.y = best.y - PH;
    p.vy = 0;
    p.onGround = true;
    p.jumps = 0;
    return best;
  }
  return null;
}

function depenetratePlatforms(p) {
  for (const pl of platforms) {
    if (pl.broken || pl.type === 'spike' || pl.type === 'wall' || pl.type === 'gate') continue;
    if (!aabb(p.x, p.y, PW, PH, pl.x, pl.y, pl.w, pl.h)) continue;
    const feet = p.y + PH;
    const cx = p.x + PW / 2;
    if (Math.abs(feet - pl.y) <= 10 && cx >= pl.x + 2 && cx <= pl.x + pl.w - 2) continue;
    if (p.vy < -0.8) continue;
    if (cx <= pl.x + pl.w * 0.5) { p.x = pl.x - PW; p.hitWall = 1; }
    else { p.x = pl.x + pl.w; p.hitWall = -1; }
    p.vx = 0;
  }
}

function playerOnCrumble(pl) {
  const p = playerState;
  const cx = p.x + PW / 2;
  return cx > pl.x + 4 && cx < pl.x + pl.w - 4
    && Math.abs(p.y + PH - pl.y) < 8;
}

function updateCrumble(dt) {
  const p = playerState;
  for (const pl of platforms) {
    if (pl.type !== 'crumble' || pl.broken) continue;

    if (!pl.crumbling && playerOnCrumble(pl)) {
      pl.crumbling = true;
      pl.crumbleTimer = CRUMBLE_DELAY;
    }
    if (!pl.crumbling) continue;

    pl.crumbleTimer -= dt;
    if (pl.crumbleTimer <= 0) {
      pl.broken = true;
      spawnParticles(pl.x + pl.w / 2, pl.y, COL.plat, 10);
      if (p.onGround && playerOnCrumble(pl)) p.onGround = false;
    }
  }
}

function updateEnemies(dt) {
  if (templeSeq) return;
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.type === 'cerberus') {
      updateCerberus(e, dt);
      cerberusMeleeHit(e);
      if (invulnTimer <= 0 && cerberusEngaged(e)
          && e.atkPhase !== 'lunge' && e.atkPhase !== 'roar'
          && aabb(playerState.x, playerState.y, PW, PH, e.x + 8, e.y + 20, e.w - 16, e.h - 12)) die();
      continue;
    }
    e.phase += dt;
    e.x += e.vx * frameStep(dt);
    if (e.x < e.minX || e.x + e.w > e.maxX) e.vx *= -1;
    if (invulnTimer <= 0 && aabb(playerState.x, playerState.y, PW, PH, e.x, e.y, e.w, e.h)) die();
  }
  updateBossProjectiles(dt);
}

function spawnCerberusMist(e, hx, headIdx) {
  const px = playerState.x + PW * 0.5;
  const py = playerState.y + PH * 0.55;
  const sx = hx;
  const sy = e.y + 16;
  const dx = px - sx;
  const dy = py - sy;
  const dist = Math.hypot(dx, dy) || 1;
  const speed = 138 + headIdx * 10;
  bossProjectiles.push({
    x: sx - 8,
    y: sy - 6,
    vx: (dx / dist) * speed,
    vy: (dy / dist) * speed,
    life: 2.8,
    w: 26,
    h: 20,
    kind: 'mist',
  });
}

function cerberusMeleeHit(e) {
  if (invulnTimer > 0 || !cerberusEnraged(e) || e.atkPhase !== 'lunge' || e.atkT < 0.06) return;
  const p = playerState;
  const hx = e.x - 64;
  const hy = e.y + 6;
  if (aabb(p.x, p.y, PW, PH, hx, hy, 78, 40)) die();
}

function cerberusEngaged(e) {
  const px = playerState.x + PW / 2;
  return px >= e.anchorX - 520 && px <= e.anchorX + 280;
}

function cerberusPatrol(e, dt) {
  const px = playerState.x + PW / 2;
  const target = Math.max(e.patrolMin, Math.min(e.patrolMax, px - e.w * 0.42));
  const dx = target - e.x;
  if (Math.abs(dx) > 0.5) {
    const step = Math.sign(dx) * Math.min(Math.abs(dx), CERBERUS_ATK.PATROL * dt);
    e.x += step;
    e.moveDir = Math.sign(dx);
  } else {
    e.moveDir = 0;
  }
}

function updateCerberus(e, dt) {
  if (!cerberusEngaged(e)) {
    e.x = e.anchorX;
    e.atkPhase = 'idle';
    e.atkTimer = CERBERUS_ATK.IDLE;
    e.atkT = 0;
    return;
  }
  e.phase += dt;
  e.hitFlash = Math.max(0, e.hitFlash - dt);
  e.hurtTimer = Math.max(0, e.hurtTimer - dt);

  if (!cerberusEnraged(e)) {
    e.atkPhase = 'idle';
    e.atkTimer = CERBERUS_ATK.IDLE;
    e.atkT = 0;
    cerberusPatrol(e, dt);
    return;
  }

  e.atkTimer -= dt;
  if (e.atkPhase === 'idle') cerberusPatrol(e, dt);

  if (e.atkPhase === 'idle' && e.atkTimer <= 0) {
    e.atkPhase = 'windup';
    e.atkT = 0;
    e.roarDamaged = false;
  }
  if (e.atkPhase === 'windup') {
    e.atkT += dt;
    if (e.atkT >= CERBERUS_ATK.WINDUP) {
      e.atkPhase = 'roar';
      e.atkT = 0;
      e.roarDamaged = false;
      camShake = 5;
      const heads = [e.x + 14, e.x + 36, e.x + 58];
      heads.forEach((hx, i) => {
        if (!cerberusHeadAlive(e, i)) return;
        spawnCerberusMist(e, hx, i);
      });
      spawnParticles(e.x + e.w / 2, e.y + 10, '#8a6aaa', 8);
    }
  } else if (e.atkPhase === 'roar') {
    e.atkT += dt;
    e.moveDir = -1;
    if (Math.random() < 0.55) {
      spawnParticles(e.x + 10 + Math.random() * 50, e.y + 8 + Math.random() * 16, '#c070ff', 2);
    }
    if (e.atkT >= CERBERUS_ATK.ROAR) {
      e.atkPhase = 'lunge';
      e.atkT = 0;
    }
  } else if (e.atkPhase === 'lunge') {
    e.atkT += dt;
    e.x -= dt * CERBERUS_ATK.LUNGE_SPD;
    e.moveDir = -1;
    if (e.atkT >= CERBERUS_ATK.LUNGE) {
      e.x = Math.max(e.patrolMin, Math.min(e.patrolMax, e.x));
      e.atkPhase = 'idle';
      e.atkTimer = CERBERUS_ATK.RECOVER + Math.random() * 0.55;
    }
  }
}

function updateBossProjectiles(dt) {
  const p = playerState;
  for (let i = bossProjectiles.length - 1; i >= 0; i--) {
    const b = bossProjectiles[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.vy += 28 * dt;
    b.life -= dt;
    if (Math.random() < 0.4) {
      spawnParticles(b.x + b.w * 0.5, b.y + b.h * 0.5, '#e0a0ff', 1);
    }
    if (b.life <= 0) { bossProjectiles.splice(i, 1); continue; }
    const pad = 6;
    if (invulnTimer <= 0 && aabb(
      p.x - pad, p.y - pad, PW + pad * 2, PH + pad * 2,
      b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2,
    )) {
      bossProjectiles.splice(i, 1);
      flasher('#9a50c8', 0.35);
      die();
    }
  }
}

function tryAttack() {
  if (phase !== 'play' || narrActive || attackTimer > 0 || attackCooldown > 0) return;
  initAudio();
  sonCriDoom();
  attackTimer = ATTACK.DURATION;
  distortAmt = 1;
  camShake = 10;
  attackCooldown = ATTACK.COOLDOWN;
  playerState.anim = 'attack';
  spawnShockwaves();
  killEnemiesInRange();
  flasher('#4aff8a', 0.4);
  for (let i = 0; i < 18; i++) {
    particles.push({
      x: playerState.x + PW / 2,
      y: playerState.y + PH * 0.35,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 0.5 + Math.random() * 0.4,
      color: i % 2 ? COL.glow : COL.eye,
      size: 2 + Math.random() * 3,
    });
  }
}

function resolveCollisions(dt) {
  const p = playerState;
  const fs = frameStep(dt);
  const airborne = !p.onGround;
  p.onGround = false;
  p.hitWall = 0;

  p.vy += (airborne ? GRAV_AIR : GRAV) * fs;
  if (p.vy > 9) p.vy = 9;

  p.vx += dreamPull() * 0.08 * fs;

  const left = touchKeys.left || keys.ArrowLeft || keys.KeyA;
  const right = touchKeys.right || keys.ArrowRight || keys.KeyD;
  const ctrl = moveControl();

  if (left) { p.vx -= RUN * ctrl * fs; p.facing = -1; }
  if (right) { p.vx += RUN * ctrl * fs; p.facing = 1; }
  if (!left && !right && dreamPull() > 0.5) p.facing = 1;

  p.vx *= Math.pow(0.92, fs);
  if (p.vx > MAX_VX) p.vx = MAX_VX;
  if (p.vx < -MAX_VX * 0.6) p.vx = -MAX_VX * 0.6;

  p.x += p.vx * fs;
  for (const pl of platforms) {
    if (pl.broken || pl.type === 'spike') continue;
    if (pl.type === 'gate' && currentSpeed() > SLOW_THRESH) continue;
    if (!platformBlocksSide(p, pl)) continue;
    if (p.vx > 0) { p.x = pl.x - PW; p.hitWall = 1; }
    else if (p.vx < 0) { p.x = pl.x + pl.w; p.hitWall = -1; }
    p.vx = 0;
  }

  p.y += p.vy * fs;
  const stoodPlat = snapPlayerToPlatforms(p);
  depenetratePlatforms(p);
  for (const pl of platforms) {
    if (pl.type === 'spike' && !pl.broken) {
      if (invulnTimer <= 0
          && aabb(p.x, p.y + PH * 0.5, PW, PH * 0.5, pl.x, pl.y, pl.w, pl.h)) {
        die();
        return;
      }
    }
  }

  for (const w of windZones) {
    if (!aabb(p.x, p.y, PW, PH, w.x, w.y, w.w, w.h)) continue;
    if (currentSpeed() > SLOW_THRESH) { p.vy -= w.force * fs; p.vx += w.force * 0.5 * fs; }
  }

  if (p.y > WORLD_DEATH_Y) {
    die();
    return;
  }

  if (stoodPlat && stoodPlat.type === 'gate' && currentSpeed() <= SLOW_THRESH && !tipsSeen.has('gate')) {
    tipsSeen.add('gate');
    tipBubble(
      'PASSAGE ÉTROIT',
      'Ralenti pour glisser entre les rochers. Trop vite, et le passage te bloque.',
      3800,
    );
  }

  for (const it of items) {
    if (!it.taken && aabb(p.x, p.y, PW, PH, it.x, it.y, 16, 16)) collectItem(it);
  }

  for (const t of triggers) {
    if (t.fired && t.once) continue;
    if (aabb(p.x, p.y, PW, PH, t.x, t.y, t.w, t.h)) {
      t.fired = true;
      fireTrigger(t.id);
    }
  }
}

function tryJump() {
  const p = playerState;
  if (phase !== 'play' || narrActive || templeSeq) return;
  if (p.onGround) {
    p.vy = JUMP_VS[0];
    p.onGround = false;
    p.jumps = 1;
    if (attackTimer <= 0) p.anim = 'jump';
    spawnParticles(p.x + PW * 0.6, p.y + PH, COL.claw, 4);
  } else if (p.jumps < MAX_JUMPS) {
    p.vy = JUMP_VS[p.jumps] || JUMP_VS[JUMP_VS.length - 1];
    p.jumps++;
    if (attackTimer <= 0) p.anim = 'air';
    spawnParticles(p.x + PW * 0.6, p.y + PH * 0.5, COL.glow, 4 + p.jumps);
  }
}

function updateAnim(dt) {
  const p = playerState;
  p.sleepy = slowBuff.timer > 0;
  p.blink = (p.blink + dt) % 3;

  if (attackTimer > 0) {
    p.anim = 'attack';
    return;
  }

  if (!p.onGround) {
    p.anim = p.vy < -1.5 ? 'jump' : p.vy > 2 ? 'fall' : 'air';
  } else if (Math.abs(p.vx) > 0.35) {
    p.anim = 'walk';
    p.animFrame += dt * (3 + Math.abs(p.vx) * 0.6);
  } else if (p.hitWall) {
    p.anim = 'wall';
  } else {
    p.anim = 'idle';
    p.animFrame += dt * 1.2;
  }
}

function getSomnulPose() {
  const p = playerState;
  const breathe = Math.sin(animT * 2.2) * 0.04;
  const idleSway = Math.sin(animT * 1.4) * 0.03;

  if (p.anim === 'attack') {
    const t = 1 - attackTimer / ATTACK.DURATION;
    const windup = Math.min(1, t * 4);
    const scream = Math.max(0, 1 - attackTimer / ATTACK.DURATION);
    return {
      bodyRot: -0.12 - windup * 0.18,
      bodyY: -2 - windup * 3,
      bodyScale: 1 + windup * 0.08,
      headRot: -0.35 - scream * 0.55,
      headY: -4 - scream * 5,
      jawOpen: 2 + scream * 8,
      armF: -1.4 - scream * 0.5,
      armB: -0.6 - scream * 0.3,
      legF: 4 + scream * 2,
      legB: -3 - scream,
      walk: 0,
      eyeGlow: 8 + scream * 12,
      mouthGlow: scream,
    };
  }

  const walk = Math.sin(p.animFrame) * (p.anim === 'walk' ? 1.4 : 0);
  const walk2 = Math.cos(p.animFrame) * (p.anim === 'walk' ? 0.8 : 0);

  if (p.anim === 'walk') {
    return {
      bodyRot: -0.08 + walk2 * 0.04,
      bodyY: Math.abs(walk) * 1.5,
      bodyScale: 1,
      headRot: walk2 * 0.06,
      headY: Math.abs(walk) * 0.8,
      jawOpen: 0,
      armF: 0.45 + walk * 0.35,
      armB: 0.75 - walk * 0.35,
      legF: walk * 3.5,
      legB: -walk * 3.5,
      walk, eyeGlow: 5, mouthGlow: 0,
    };
  }

  if (p.anim === 'jump') {
    return {
      bodyRot: -0.2, bodyY: -1, bodyScale: 1.02,
      headRot: -0.15, headY: -2, jawOpen: 1,
      armF: -1.0, armB: -0.5, legF: -4, legB: 3,
      walk: 0, eyeGlow: 6, mouthGlow: 0,
    };
  }

  if (p.anim === 'fall' || p.anim === 'air') {
    return {
      bodyRot: 0.05, bodyY: 0, bodyScale: 1,
      headRot: 0.1, headY: 1, jawOpen: 2,
      armF: 0.9 + Math.sin(animT * 8) * 0.2,
      armB: 0.5, legF: 2, legB: -2,
      walk: 0, eyeGlow: 5, mouthGlow: 0,
    };
  }

  if (p.anim === 'wall') {
    return {
      bodyRot: 0.15, bodyY: 2, bodyScale: 0.96,
      headRot: 0.2, headY: 3, jawOpen: 3,
      armF: 0.2, armB: 1.1, legF: 2, legB: -1,
      walk: 0, eyeGlow: 7, mouthGlow: 0,
    };
  }

  return {
    bodyRot: -0.05 + idleSway,
    bodyY: breathe * 8,
    bodyScale: 1 + breathe,
    headRot: idleSway * 2,
    headY: breathe * 4,
    jawOpen: 0,
    armF: 0.55 + Math.sin(animT * 1.8) * 0.08,
    armB: 0.85,
    legF: Math.sin(animT * 1.8) * 0.5,
    legB: -Math.sin(animT * 1.8) * 0.5,
    walk: 0, eyeGlow: 4 + (p.sleepy ? 2 : 0), mouthGlow: 0,
  };
}

function drawSomnul(x, y) {
  const p = playerState;
  if (templeSeq && templeSeq.alpha <= 0.02) return;

  const dir = p.facing;
  const pose = getSomnulPose();

  ctx.save();
  if (templeSeq) ctx.globalAlpha = templeSeq.alpha;
  ctx.translate(x + PW * 0.45, y + PH);
  ctx.scale(dir, 1);

  // Ombre dynamique
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(2, 3, 14 + pose.bodyScale * 2, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(0, pose.bodyY);
  ctx.rotate(pose.bodyRot);
  ctx.scale(pose.bodyScale, pose.bodyScale);

  // Pattes
  ctx.fillStyle = '#2a2218';
  ctx.fillRect(-2, -4 + pose.legB, 5, 8);
  ctx.fillRect(3, -4 + pose.legF, 5, 8);
  ctx.fillStyle = COL.claw;
  ctx.fillRect(-1, 3 + pose.legB, 3, 2);
  ctx.fillRect(4, 3 + pose.legF, 3, 2);

  // Corps massif
  ctx.fillStyle = COL.fur;
  ctx.beginPath();
  ctx.ellipse(-2, -18, 16, 20, -0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = COL.belly;
  ctx.beginPath();
  ctx.ellipse(-6, -16, 10, 14, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // Fourrure hérissée
  ctx.strokeStyle = COL.furL;
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const furLen = p.anim === 'attack' ? 5 : 3;
    ctx.beginPath();
    ctx.moveTo(-14, -26 + i * 4);
    ctx.lineTo(-18 - furLen - (i % 2), -28 + i * 4);
    ctx.stroke();
  }

  // Bras arrière
  ctx.save();
  ctx.translate(-8, -14);
  ctx.rotate(pose.armB);
  ctx.fillStyle = '#2e261c';
  ctx.fillRect(-2, 0, 5, 13);
  ctx.fillStyle = COL.claw;
  ctx.fillRect(-2, 12, 2, 4);
  ctx.fillRect(1, 12, 2, 4);
  ctx.restore();

  // Bras avant (griffes)
  ctx.save();
  ctx.translate(4, -22);
  ctx.rotate(pose.armF);
  ctx.fillStyle = COL.fur;
  ctx.fillRect(-3, 0, 7, 16);
  ctx.fillStyle = COL.claw;
  for (let i = 0; i < 3; i++) {
    ctx.fillRect(-2 + i * 2, 14, 2, 6 + (i === 1 ? 3 : 0));
    ctx.fillStyle = COL.clawD;
    ctx.fillRect(-2 + i * 2, 19, 2, 2);
    ctx.fillStyle = COL.claw;
  }
  ctx.restore();

  // Tête
  ctx.save();
  ctx.translate(10, -30 + pose.headY);
  ctx.rotate(pose.headRot);
  ctx.fillStyle = COL.fur;
  ctx.beginPath();
  ctx.ellipse(0, 0, 7, 6.5, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Museau
  ctx.fillStyle = '#4a4034';
  ctx.beginPath();
  ctx.ellipse(7, 2, 6, 4 + pose.jawOpen * 0.15, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Mâchoire ouverte (attaque)
  if (pose.jawOpen > 0.5) {
    ctx.fillStyle = '#1a0808';
    ctx.fillRect(3, 2, 10, 2 + pose.jawOpen);
    ctx.fillStyle = '#4a1020';
    ctx.fillRect(4, 4, 8, pose.jawOpen * 0.6);
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = '#c8c0b0';
      ctx.fillRect(4 + i * 2, 3 + pose.jawOpen * 0.5, 1, 2);
    }
    if (pose.mouthGlow > 0) {
      ctx.fillStyle = `rgba(74,255,138,${pose.mouthGlow * 0.5})`;
      ctx.shadowColor = COL.glow;
      ctx.shadowBlur = 12;
      ctx.fillRect(5, 3, 6, 2 + pose.jawOpen * 0.4);
      ctx.shadowBlur = 0;
    }
  } else {
    ctx.fillStyle = COL.clawD;
    ctx.fillRect(10, 1, 3, 2);
    ctx.fillStyle = '#1a1410';
    ctx.fillRect(4, 4, 8, 2);
  }

  // Oeil
  const blink = p.blink > 2.7 && p.blink < 2.85;
  const sleepy = p.sleepy && Math.sin(animT * 4) > 0.3;
  ctx.fillStyle = '#0a0e08';
  ctx.fillRect(-1, -3, 5, sleepy || blink ? 1 : 4);
  if (!sleepy && !blink) {
    ctx.fillStyle = COL.eye;
    ctx.shadowColor = COL.eyeGlow;
    ctx.shadowBlur = pose.eyeGlow;
    ctx.fillRect(0, -2, 3, 3);
    ctx.fillStyle = '#0a1408';
    ctx.fillRect(1, -1, 1, 2);
    ctx.shadowBlur = 0;
  }
  ctx.restore();
  ctx.restore();
  ctx.restore();
}

function drawEnemy(ex, ey, e) {
  if (e.type === 'cerberus') {
    drawCerberus(ex, ey, e);
    return;
  }
  const bob = Math.sin(e.phase * 3) * 2;
  const rx = ex, ry = ey + bob;

  // Corps visqueux vert doom
  ctx.fillStyle = COL.enemy;
  ctx.beginPath();
  ctx.ellipse(rx + 11, ry + 14, 12, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = COL.enemyD;
  ctx.beginPath();
  ctx.ellipse(rx + 11, ry + 16, 8, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Dents
  ctx.fillStyle = '#c8d8b0';
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(rx + 4 + i * 4, ry + 20);
    ctx.lineTo(rx + 6 + i * 4, ry + 24);
    ctx.lineTo(rx + 8 + i * 4, ry + 20);
    ctx.fill();
  }

  // Yeux verts lumineux
  ctx.fillStyle = COL.enemyEye;
  ctx.shadowColor = COL.enemyEye;
  ctx.shadowBlur = 6;
  ctx.fillRect(rx + 5, ry + 8, 4, 3);
  ctx.fillRect(rx + 13, ry + 8, 4, 3);
  ctx.shadowBlur = 0;

  // Corne fuzz
  ctx.fillStyle = '#2a5a38';
  ctx.beginPath();
  ctx.moveTo(rx + 6, ry + 4);
  ctx.lineTo(rx + 4, ry - 2);
  ctx.lineTo(rx + 9, ry + 3);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(rx + 16, ry + 4);
  ctx.lineTo(rx + 18, ry - 2);
  ctx.lineTo(rx + 13, ry + 3);
  ctx.fill();
}

function drawCerberusHead(hx, hy, idx, dead, e, windup, roar) {
  const flash = e.hitFlash > 0;
  const bob = Math.sin(e.phase * 3.4 + idx * 1.35) * (dead ? 0.6 : 2.2);
  const pull = windup ? -5 - idx * 2 : 0;
  const jawDrop = roar ? 4 + Math.sin(animT * 38 + idx) * 2 : 0;
  const y = hy + bob + (dead ? 9 : 0) + pull;
  const x = hx + (idx === 1 ? 2 : 0);

  const C = flash
    ? { a: '#fff4f0', b: '#ffd0c8', c: '#ff8880', d: '#ffb0a8', e: '#fff', sn: '#ffe0d8' }
    : dead
      ? { a: '#181420', b: '#121018', c: '#221828', d: '#1a1420', e: '#2a2030', sn: '#181420' }
      : { a: '#3a2848', b: '#2a1c38', c: '#524068', d: '#1a1228', e: '#685880', sn: '#403050' };

  // Cou
  ctx.fillStyle = C.b;
  ctx.fillRect(x + 5, y + 16, 12, dead ? 5 : 11);
  ctx.fillStyle = C.c;
  ctx.fillRect(x + 7, y + 17, 8, dead ? 4 : 9);

  // Crinière / nuque
  ctx.fillStyle = C.d;
  ctx.fillRect(x + 2, y + 8, 4, 10);
  ctx.fillRect(x + 16, y + 8, 4, 10);
  ctx.fillStyle = C.a;
  ctx.fillRect(x + 1, y + 4, 3, 6);
  ctx.fillRect(x + 18, y + 4, 3, 6);
  ctx.fillRect(x + 6, y + 1, 10, 4);

  // Oreilles
  ctx.fillStyle = C.d;
  ctx.fillRect(x, y + 3, 4, 7);
  ctx.fillRect(x + 18, y + 3, 4, 7);
  ctx.fillStyle = C.b;
  ctx.fillRect(x + 1, y + 4, 2, 4);
  ctx.fillRect(x + 19, y + 4, 2, 4);

  // Crâne
  ctx.fillStyle = C.a;
  ctx.fillRect(x + 3, y + 4, 16, 11);
  ctx.fillStyle = C.c;
  ctx.fillRect(x + 5, y + 5, 12, 8);
  ctx.fillStyle = C.e;
  ctx.fillRect(x + 6, y + 6, 4, 3);
  ctx.fillRect(x + 12, y + 6, 4, 3);

  // Museau
  ctx.fillStyle = C.sn;
  ctx.fillRect(x + 5, y + 12, 12, 5 + jawDrop);
  ctx.fillStyle = C.b;
  ctx.fillRect(x + 7, y + 13, 8, 3 + jawDrop * 0.5);
  ctx.fillStyle = '#0a0810';
  ctx.fillRect(x + 10, y + 14 + jawDrop * 0.3, 4, 2);

  if (!dead) {
    // Yeux - iris rouge/brume
    const eyeY = y + 7;
    const glow = flash ? 14 : 7 + (roar ? 4 : 0);
    ctx.shadowColor = flash ? '#fff' : '#ff4060';
    ctx.shadowBlur = glow;
    ctx.fillStyle = flash ? '#fff' : '#cc1828';
    ctx.fillRect(x + 6, eyeY, 4, 4);
    ctx.fillRect(x + 12, eyeY, 4, 4);
    ctx.fillStyle = flash ? '#faa' : '#ff6078';
    ctx.fillRect(x + 7, eyeY + 1, 2, 2);
    ctx.fillRect(x + 13, eyeY + 1, 2, 2);
    ctx.fillStyle = '#0a0810';
    ctx.fillRect(x + 8, eyeY + 1, 1, 2);
    ctx.fillRect(x + 14, eyeY + 1, 1, 2);
    ctx.shadowBlur = 0;

    // Crocs
    ctx.fillStyle = '#f0e4d0';
    ctx.fillRect(x + 7, y + 15 + jawDrop, 2, 3 + jawDrop);
    ctx.fillRect(x + 11, y + 15 + jawDrop, 2, 3 + jawDrop);
    ctx.fillRect(x + 9, y + 16 + jawDrop, 2, 2 + jawDrop * 0.5);
    if (roar) {
      ctx.fillStyle = 'rgba(180,120,220,0.35)';
      ctx.fillRect(x + 4, y + 17 + jawDrop, 14, 4);
    }
  } else {
    ctx.fillStyle = '#0a0810';
    ctx.fillRect(x + 7, y + 8, 8, 2);
    ctx.fillStyle = '#5a2840';
    ctx.fillRect(x + 8, y + 15, 6, 2);
  }
}

function drawCerberusAttackFx(x, y, e) {
  if (!cerberusEnraged(e)) return;

  if (e.atkPhase === 'windup') {
    const t = Math.min(1, e.atkT / CERBERUS_ATK.WINDUP);
    const pulse = 0.35 + Math.sin(animT * 22) * 0.15;
    ctx.fillStyle = `rgba(255,80,100,${pulse * t})`;
    ctx.fillRect(x - 8, y - 18, e.w + 16, 8);
    ctx.strokeStyle = `rgba(255,120,140,${0.45 + t * 0.4})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x + 36, y + 20, 18 + t * 34, Math.PI * 0.85, Math.PI * 1.15);
    ctx.stroke();
  }

  if (e.atkPhase === 'roar') {
    const t = Math.min(1, e.atkT / CERBERUS_ATK.ROAR);
    const waveW = 50 + t * 260;
    const alpha = 0.55 - t * 0.2;
    ctx.fillStyle = `rgba(160,60,255,${alpha})`;
    ctx.fillRect(x - waveW + 40, y - 10, waveW, e.h + 28);
    ctx.fillStyle = `rgba(220,160,255,${alpha * 0.85})`;
    ctx.fillRect(x - waveW + 40, y + 8, waveW * 0.9, 32);
    ctx.strokeStyle = `rgba(255,200,255,${0.5 + Math.sin(animT * 30) * 0.2})`;
    ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      const ri = 24 + t * 80 + i * 22;
      ctx.beginPath();
      ctx.arc(x + 36, y + 22, ri, Math.PI * 0.75, Math.PI * 1.25);
      ctx.stroke();
    }
  }

  if (e.atkPhase === 'lunge') {
    ctx.fillStyle = 'rgba(255,70,110,0.35)';
    ctx.fillRect(x - 72, y + 8, 76, 38);
    ctx.strokeStyle = 'rgba(255,140,160,0.7)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 72, y + 8, 76, 38);
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = `rgba(255,180,200,${0.4 - i * 0.08})`;
      ctx.fillRect(x + 8 + i * 10, y + 38, 8, 4);
    }
  }
}

function drawCerberus(sx, sy, e) {
  const hurt = e.hurtTimer > 0;
  const shake = hurt ? Math.sin(animT * 38) * 3.5 : 0;
  const lean = (e.moveDir || 0) * 5;
  const x = sx + shake + lean;
  const y = sy + Math.sin(e.phase * 2.2) * 1.2;
  const windup = e.atkPhase === 'windup';
  const roar = e.atkPhase === 'roar' || e.atkPhase === 'lunge';
  const lunge = e.atkPhase === 'lunge';

  drawCerberusAttackFx(x, y, e);

  // Aura brume onirique
  if (roar || windup) {
    const pulse = 0.22 + Math.sin(animT * 16) * 0.1;
    ctx.fillStyle = `rgba(120,80,180,${pulse})`;
    ctx.fillRect(x - 22, y - 18, e.w + 44, e.h + 28);
    ctx.fillStyle = `rgba(200,100,255,${pulse * 0.45})`;
    ctx.fillRect(x - 12, y - 6, e.w + 24, e.h + 12);
  } else if (cerberusEnraged(e)) {
    const pulse = 0.08 + Math.sin(animT * 4) * 0.04;
    ctx.fillStyle = `rgba(100,60,160,${pulse})`;
    ctx.fillRect(x - 10, y - 8, e.w + 20, e.h + 14);
  }

  ctx.save();

  // Ombre
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(x + 38, y + 50, 34, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Queue / brume arrière
  ctx.fillStyle = '#1a1428';
  ctx.fillRect(x + 58, y + 34, 14, 8);
  ctx.fillStyle = 'rgba(106,154,170,0.25)';
  ctx.fillRect(x + 64, y + 28, 10, 12);
  ctx.fillRect(x + 70, y + 32, 8, 8);

  // Pattes arrière
  ctx.fillStyle = '#1a1228';
  ctx.fillRect(x + 48, y + 38, 10, 14);
  ctx.fillRect(x + 54, y + 38, 10, 14);
  ctx.fillStyle = '#2a2038';
  ctx.fillRect(x + 49, y + 40, 7, 10);
  ctx.fillRect(x + 55, y + 40, 7, 10);
  ctx.fillStyle = '#4a3858';
  ctx.fillRect(x + 48, y + 50, 4, 3);
  ctx.fillRect(x + 54, y + 50, 4, 3);
  ctx.fillRect(x + 60, y + 50, 4, 3);

  // Torse
  ctx.fillStyle = '#221830';
  ctx.fillRect(x + 10, y + 30, 52, 18);
  ctx.fillStyle = '#322848';
  ctx.fillRect(x + 14, y + 32, 44, 14);
  ctx.fillStyle = '#403058';
  ctx.fillRect(x + 18, y + 34, 36, 10);
  // Côtes stylisées
  ctx.fillStyle = '#524068';
  for (let i = 0; i < 4; i++) {
    ctx.fillRect(x + 20 + i * 9, y + 36, 2, 6);
  }

  // Pattes avant
  ctx.fillStyle = '#1a1228';
  ctx.fillRect(x + 12, y + 40, 11, 14);
  ctx.fillRect(x + 26, y + 40, 11, 14);
  ctx.fillRect(x + 40, y + 40, 11, 14);
  ctx.fillStyle = '#2a2038';
  ctx.fillRect(x + 13, y + 42, 8, 10);
  ctx.fillRect(x + 27, y + 42, 8, 10);
  ctx.fillRect(x + 41, y + 42, 8, 10);
  ctx.fillStyle = '#685878';
  ctx.fillRect(x + 12, y + 50, 4, 3);
  ctx.fillRect(x + 26, y + 50, 4, 3);
  ctx.fillRect(x + 40, y + 50, 4, 3);

  // Colliers os / brume
  ctx.fillStyle = '#9a8898';
  ctx.fillRect(x + 16, y + 28, 6, 3);
  ctx.fillRect(x + 34, y + 28, 6, 3);
  ctx.fillRect(x + 52, y + 28, 6, 3);
  ctx.fillStyle = 'rgba(138,106,170,0.5)';
  ctx.fillRect(x + 14, y + 27, 44, 2);

  // Trois têtes
  const headY = y + (windup ? 2 : 8);
  drawCerberusHead(x + 2, headY, 0, !cerberusHeadAlive(e, 0), e, windup, roar);
  drawCerberusHead(x + 26, headY - 4, 1, !cerberusHeadAlive(e, 1), e, windup, roar);
  drawCerberusHead(x + 50, headY, 2, !cerberusHeadAlive(e, 2), e, windup, roar);

  ctx.restore();

  // Orbes de vie — vert / orange / noir
  for (let i = 0; i < 3; i++) {
    const hp = e.headHp[i];
    const ox = x + 20 + i * 14;
    const oy = y - 12;
    let fill, glow, inner;
    if (hp <= 0) {
      fill = '#1a1018';
      glow = 'transparent';
      inner = null;
      ctx.fillStyle = 'rgba(20,10,16,0.6)';
    } else if (hp === 1) {
      fill = '#e88828';
      glow = '#ffaa44';
      inner = '#ffe0a0';
      ctx.fillStyle = 'rgba(200,120,40,0.3)';
    } else {
      fill = '#7affaa';
      glow = COL.glow;
      inner = '#c8ffe0';
      ctx.fillStyle = 'rgba(74,255,138,0.25)';
    }
    ctx.fillRect(ox - 1, oy - 1, 9, 9);
    ctx.fillStyle = fill;
    ctx.shadowColor = glow;
    ctx.shadowBlur = hp > 0 ? 6 : 0;
    ctx.fillRect(ox, oy, 7, 7);
    if (inner) {
      ctx.fillStyle = inner;
      ctx.fillRect(ox + 2, oy + 2, 3, 3);
    }
    ctx.shadowBlur = 0;
  }
}

function drawBossProjectiles() {
  for (const b of bossProjectiles) {
    const rx = b.x - cam.x;
    const ry = b.y - cam.y;
    if (rx + b.w < -20 || rx > VW + 20) continue;
    const pulse = 0.65 + Math.sin(animT * 18 + b.x * 0.01) * 0.25;
    ctx.fillStyle = `rgba(120,40,200,${pulse * 0.45})`;
    ctx.shadowColor = '#e080ff';
    ctx.shadowBlur = 14;
    ctx.fillRect(rx - 4, ry - 3, b.w + 8, b.h + 6);
    ctx.fillStyle = `rgba(220,150,255,${pulse})`;
    ctx.fillRect(rx, ry, b.w, b.h);
    ctx.fillStyle = `rgba(255,230,255,${pulse * 0.9})`;
    ctx.fillRect(rx + 4, ry + 4, b.w - 8, b.h - 8);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = `rgba(255,200,255,${pulse})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(rx - 1, ry - 1, b.w + 2, b.h + 2);
  }
}

function stripNearWhite(imgData) {
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    if (d[i + 3] < 8) continue;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const lum = (r + g + b) / 3;
    const sat = max - min;
    if (lum > 232 && sat < 20) {
      d[i + 3] = 0;
    } else if (lum > 205 && sat < 28) {
      d[i + 3] = Math.min(d[i + 3], Math.floor((228 - lum) * 7));
    } else if (lum > 175 && r > 168 && g > 162 && b > 155 && sat < 35) {
      d[i + 3] = Math.min(d[i + 3], Math.floor((195 - lum) * 4));
    }
  }
  return imgData;
}

function loadBackground() {
  const img = new Image();
  img.onload = () => {
    const pw = 80, ph = 60;
    bgNormal = document.createElement('canvas');
    bgNormal.width = pw;
    bgNormal.height = ph;
    const nctx = bgNormal.getContext('2d');
    nctx.imageSmoothingEnabled = false;
    nctx.drawImage(img, 0, 0, pw, ph);

    bgFlipped = document.createElement('canvas');
    bgFlipped.width = pw;
    bgFlipped.height = ph;
    const fctx = bgFlipped.getContext('2d');
    fctx.imageSmoothingEnabled = false;
    fctx.translate(pw, 0);
    fctx.scale(-1, 1);
    fctx.drawImage(img, 0, 0, pw, ph);
  };
  img.src = '../assets/images/fondespace.jpeg';
}

function loadTemple() {
  const img = new Image();
  img.onload = () => {
    const src = document.createElement('canvas');
    src.width = img.width;
    src.height = img.height;
    const sctx = src.getContext('2d');
    sctx.imageSmoothingEnabled = false;
    sctx.drawImage(img, 0, 0);
    sctx.putImageData(stripNearWhite(sctx.getImageData(0, 0, img.width, img.height)), 0, 0);

    const pw = 74;
    const ph = 56;
    templeSprite = document.createElement('canvas');
    templeSprite.width = pw;
    templeSprite.height = ph;
    const tctx = templeSprite.getContext('2d');
    tctx.imageSmoothingEnabled = false;
    tctx.drawImage(src, 0, 0, pw, ph);
  };
  img.src = '../assets/images/temple.png';
}

function drawTemple() {
  if (!temple || !templeSprite) return;
  const rx = temple.x - cam.x;
  const ry = temple.y - cam.y;
  if (rx + temple.w < -50 || rx > VW + 50) return;

  const glow = temple.glow || 0;
  const pulse = 0.12 + Math.sin(animT * 3) * 0.06;
  if (glow > 0.05) {
    ctx.fillStyle = `rgba(74,255,138,${glow * pulse})`;
    ctx.fillRect(rx - 14, ry - 10, temple.w + 28, temple.h + 20);
  }

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(templeSprite, 0, 0, templeSprite.width, templeSprite.height, rx, ry, temple.w, temple.h);

  if (glow > 0.15) {
    const dx = rx + temple.w * 0.41;
    const dy = ry + temple.h * 0.68;
    const dw = temple.w * 0.18;
    const dh = temple.h * 0.14;
    ctx.fillStyle = `rgba(200,255,220,${glow * 0.55})`;
    ctx.shadowColor = COL.glow;
    ctx.shadowBlur = 8 + glow * 16;
    ctx.fillRect(dx, dy, dw, dh);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = `rgba(74,255,138,${glow * 0.7})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(dx - 1, dy - 1, dw + 2, dh + 2);
  }
}

function drawBackground() {
  const t = animT;

  if (bgNormal && bgFlipped) {
    ctx.imageSmoothingEnabled = false;
    const tileW = VW;
    const scroll = cam.x * 0.22;
    const startTile = Math.floor(scroll / tileW);
    const offset = -(scroll % tileW);

    for (let i = -1; i <= 2; i++) {
      const tileIdx = startTile + i;
      const src = tileIdx % 2 === 0 ? bgNormal : bgFlipped;
      const drawX = offset + i * tileW;
      ctx.drawImage(src, 0, 0, src.width, src.height, drawX, 0, tileW, VH);
    }
  } else {
    ctx.fillStyle = '#060d12';
    ctx.fillRect(0, 0, VW, VH);
  }

  // Voile psychédélique léger
  const h1 = (t * 12) % 360;
  ctx.fillStyle = `hsla(${h1}, 55%, 45%, 0.07)`;
  ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = `hsla(${(h1 + 90) % 360}, 60%, 50%, 0.05)`;
  ctx.fillRect(0, 0, VW, VH * 0.6);

  // Étoiles scintillantes par-dessus
  for (let i = 0; i < 24; i++) {
    const sx = (i * 97 + t * 8) % (levelW + VW) - cam.x * 0.35;
    const sy = (i * 53 + Math.sin(t + i) * 12) % 130;
    if (sx > -2 && sx < VW + 2) {
      ctx.fillStyle = `rgba(180,255,200,${0.15 + Math.sin(t * 3 + i) * 0.12})`;
      ctx.fillRect(sx, sy, 1, 1);
    }
  }
}

function drawPlatforms() {
  for (const pl of platforms) {
    if (pl.broken) continue;
    const rx = pl.x - cam.x, ry = pl.y - cam.y;
    if (rx + pl.w < -20 || rx > VW + 20) continue;

    if (pl.type === 'spike') {
      ctx.fillStyle = COL.spike;
      ctx.beginPath();
      ctx.moveTo(rx + pl.w / 2, ry);
      ctx.lineTo(rx + pl.w, ry + pl.h);
      ctx.lineTo(rx, ry + pl.h);
      ctx.fill();
      continue;
    }

    if (pl.type === 'crumble') {
      const rx0 = rx, ry0 = ry;
      let bodyCol = '#2a2820';
      let edgeCol = '#5a4a30';
      let alpha = 0.55;
      let shake = 0;

      if (pl.crumbling) {
        const left = pl.crumbleTimer / CRUMBLE_DELAY;
        const urgency = 1 - left;
        shake = Math.sin(animT * (28 + urgency * 50)) * (1 + urgency * 2.5);
        if (pl.crumbleTimer <= CRUMBLE_WARN) {
          const blink = Math.sin(animT * (38 + urgency * 90)) > 0;
          bodyCol = blink ? '#7a4030' : '#3a2018';
          edgeCol = blink ? '#c87848' : '#5a3020';
          alpha = blink ? 1 : 0.35;
        } else {
          bodyCol = '#3a2820';
          alpha = 0.45 + left * 0.35;
        }
      }

      ctx.globalAlpha = alpha;
      ctx.fillStyle = bodyCol;
      ctx.fillRect(rx0 + shake, ry0, pl.w, pl.h);
      ctx.fillStyle = COL.platL;
      ctx.fillRect(rx0 + shake, ry0, pl.w, 3);
      ctx.strokeStyle = edgeCol;
      for (let cx = 4; cx < pl.w; cx += 10) {
        ctx.beginPath();
        ctx.moveTo(rx0 + cx + shake, ry0 + 4);
        ctx.lineTo(rx0 + cx + 4 + shake, ry0 + pl.h);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      continue;
    }

    const col = COL.plat;
    ctx.fillStyle = col;
    ctx.fillRect(rx, ry, pl.w, pl.h);
    ctx.fillStyle = COL.platL;
    ctx.fillRect(rx, ry, pl.w, 3);

    if (pl.type === 'gate') {
      ctx.fillStyle = 'rgba(74,255,138,0.12)';
      ctx.fillRect(rx, ry, pl.w, pl.h);
    }
  }
}

function drawItems() {
  for (const it of items) {
    if (it.taken) continue;
    const bob = Math.sin(animT * 3 + it.bob) * 3;
    const rx = it.x - cam.x, ry = it.y - cam.y + bob;
    if (rx < -20 || rx > VW + 20) continue;
    const colors = { brume: COL.itemBrume, kalimba: COL.itemKalimba, sieste: COL.itemSieste };
    ctx.fillStyle = colors[it.kind];
    ctx.shadowColor = colors[it.kind];
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(rx + 8, ry + 8, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt * 60;
    pt.y += pt.vy * dt * 60;
    pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const pt of particles) {
    const alpha = Math.min(1, pt.life);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = pt.color;
    ctx.fillRect(Math.round(pt.x - cam.x), Math.round(pt.y - cam.y), pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
}

function updateHUD() {
  const spd = currentSpeed();
  const pct = Math.min(100, Math.max(0, (spd / ONIRIC_MAX) * 100));
  const threshPct = (SLOW_THRESH / ONIRIC_MAX) * 100;

  const fill = document.getElementById('hud-fill');
  const bar = document.getElementById('hud-bar');
  const thresh = document.getElementById('hud-thresh');
  fill.style.width = pct + '%';
  thresh.style.left = threshPct + '%';

  if (slowBuff.timer > 0) {
    fill.style.background = spd > SLOW_THRESH
      ? 'linear-gradient(to right,#4a8a9a,#8ad8e8)'
      : 'linear-gradient(to right,#2a6a5a,#6affb0)';
    bar.classList.toggle('hud-warn', slowBuff.timer <= BUFF_WARN_TIME);
  } else {
    bar.classList.remove('hud-warn');
    fill.style.background = spd > SLOW_THRESH
      ? 'linear-gradient(to right,#aa5a4a,#ff6a4a)'
      : 'linear-gradient(to right,#3a8a4e,#6affb0)';
  }

  const buff = document.getElementById('hud-buff');
  if (slowBuff.timer > 0) {
    const warn = slowBuff.timer <= BUFF_WARN_TIME ? ' · FIN IMMINENTE' : '';
    buff.textContent = slowBuff.label + ' · ' + slowBuff.timer.toFixed(1) + 's' + warn;
  } else {
    buff.textContent = 'VITESSE ' + spd.toFixed(1) + ' · SEUIL ' + SLOW_THRESH;
  }
}

function resize() {
  const scale = Math.min(window.innerWidth / VW, window.innerHeight / VH);
  canvas.style.width = (VW * scale) + 'px';
  canvas.style.height = (VH * scale) + 'px';
}

function updateGamepadVisibility() {
  const gp = document.getElementById('gamepad');
  const tutorielOpen = document.getElementById('tutoriel').style.display === 'flex';
  const show = SlothDevice.isTouchPrimary() && !narrActive && !tutorielOpen
    && phase !== 'fin' && phase !== 'temple' && phase !== 'death';
  gp.classList.toggle('visible', show);
}

function setupInput() {
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') { e.preventDefault(); tryJump(); }
    if (e.code === 'KeyX') { e.preventDefault(); tryAttack(); }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  document.querySelectorAll('.gp-btn[data-key]').forEach(btn => {
    const key = btn.dataset.key;
    const down = e => { e.preventDefault(); touchKeys[key] = true; btn.classList.add('actif'); };
    const up = e => { e.preventDefault(); touchKeys[key] = false; btn.classList.remove('actif'); };
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointerleave', up);
    btn.addEventListener('pointercancel', up);
    if (key === 'jump') btn.addEventListener('pointerdown', e => { e.preventDefault(); tryJump(); });
    if (key === 'attack') btn.addEventListener('pointerdown', e => { e.preventDefault(); tryAttack(); });
  });

  updateGamepadVisibility();
  window.addEventListener('resize', updateGamepadVisibility);
}

function update(dt) {
  if (phase === 'fin') return;

  animT += dt;

  if (phase === 'death') {
    updateDeathSequence(dt);
    updateHUD();
    return;
  }

  if (attackTimer > 0) {
    attackTimer -= dt;
    distortAmt *= Math.pow(0.9, frameStep(dt));
    camShake *= Math.pow(0.82, frameStep(dt));
    attackFlash *= Math.pow(0.88, frameStep(dt));
  }
  if (attackCooldown > 0) attackCooldown -= dt;
  if (camShake > 0 && attackTimer <= 0 && !templeSeq) camShake *= Math.pow(0.9, frameStep(dt));
  updateShockwaves(dt);

  if (attackFlash > 0 && attackTimer <= 0) attackFlash -= dt;
  if (invulnTimer > 0) invulnTimer -= dt;

  if (slowBuff.timer > 0) {
    slowBuff.timer -= dt;
    if (slowBuff.timer <= 0) slowBuff = { mult: 1, timer: 0, timeMax: 0, label: '' };
  }

  if (phase === 'intro' && !bootStarted) {
    bootStarted = true;
    snapToGround();
    startIntro();
  }

  if (templeSeq) {
    updateTempleSequence(dt);
  } else if (phase === 'play' && !narrActive) {
    resolveCollisions(dt);
    updateCrumble(dt);
    updateEnemies(dt);
    updateParticles(dt);
  }

  if (templeSeq || phase === 'play') {
    updateAnim(dt);
  }

  updateCamera();
  updateHUD();
}

function updateCamera() {
  const shakeCamX = (Math.random() - 0.5) * camShake * 0.4;
  const shakeCamY = (Math.random() - 0.5) * camShake * 0.25;
  const cx = playerState.x + PW / 2;
  const cy = playerState.y + PH / 2;

  cam.x = cx - VW / 2 + shakeCamX;
  cam.y = cy - VH / 2 + shakeCamY;
  cam.x = Math.max(0, Math.min(cam.x, levelW - VW));
  cam.y = Math.max(-40, Math.min(cam.y, 168 - VH + 60));
}

function drawWorldContent() {
  drawBackground();
  drawPlatforms();
  drawTemple();
  for (const e of enemies) {
    if (!e.alive) continue;
    const rx = e.x - cam.x, ry = e.y - cam.y;
    if (rx + e.w < -30 || rx > VW + 30) continue;
    drawEnemy(rx, ry, e);
  }
  drawBossProjectiles();
  drawItems();
  drawParticles();
}

function drawShockwaves() {
  if (!shockwaves.length) return;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  for (const w of shockwaves) {
    if (w.delay > 0) continue;
    const sx = Math.round(w.x - cam.x);
    const sy = Math.round(w.y - cam.y);
    const alpha = Math.min(1, w.life * w.alpha);
    const ri = Math.round(w.r);

    ctx.strokeStyle = `rgba(120,255,160,${alpha * 0.9})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(sx, sy, ri, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = `rgba(74,255,138,${alpha * 0.55})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(4, ri - 8), 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = `rgba(200,255,220,${alpha * 0.75})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(sx - ri, sy - Math.round(ri * 0.45), ri * 2, Math.max(6, Math.round(ri * 0.9)));
  }
  ctx.restore();
}

function draw() {
  if (!ctx) return;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, VW, VH);
  drawWorldContent();

  if (phase === 'death' && deathSeq?.phase === 'dissolve') {
    const prog = Math.min(1, deathSeq.t / DEATH_SEQ.DISSOLVE);
    drawDeathSomnul(deathSeq.x - cam.x, deathSeq.y - cam.y, prog, deathSeq.facing);
    drawDeathEffects();
  } else if (phase !== 'death' || deathSeq?.phase === 'fadein') {
    drawSomnul(playerState.x - cam.x, playerState.y - cam.y);
  }

  drawShockwaves();

  if (attackFlash > 0 && phase !== 'death') {
    ctx.fillStyle = `rgba(74,255,138,${attackFlash * 0.2})`;
    ctx.fillRect(0, 0, VW, VH);
  }

  drawDeathFade();
}

let lastT = 0;
let loopStarted = false;
function loop(t) {
  requestAnimationFrame(loop);
  if (!loopStarted) {
    loopStarted = true;
    lastT = t;
    return;
  }
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;
  if (dt <= 0) return;
  update(dt);
  draw();
}

async function init() {
  if (!SlothProgress.isUnlocked(2)) {
    slothGoToMenu();
    return;
  }
  canvas = document.getElementById('game-canvas');
  ctx = canvas.getContext('2d');
  canvas.width = VW;
  canvas.height = VH;
  buildLevel();
  applyNarrSeenToTriggers();
  snapToGround();
  loadBackground();
  loadTemple();
  setupInput();
  resize();
  window.addEventListener('resize', resize);
  SlothDevSkip.mount(() => victoire());
  requestAnimationFrame(loop);
}

init();
</script>
