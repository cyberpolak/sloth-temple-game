function drawAmpCab(rx, ry, brand) {
  // Cab 4x12 style Marshall (noir/or) ou Orange (orange/noir) — volume 3D
  const isOrange = brand === 'orange';
  const body = isOrange ? '#c45a18' : '#1a1814';
  const bodyL = isOrange ? '#e87828' : '#2e2a24';
  const bodyD = isOrange ? '#8a3a10' : '#0c0a08';
  const grill = isOrange ? '#2a1810' : '#12100c';
  const badge = isOrange ? '#1a1008' : '#c8a040';
  const w = 28, h = 32;
  const x = rx - w / 2;
  const y = ry - h;

  // Ombre
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  oval(rx + 1, ry + 1, 14, 3, 0);

  // Boîtier profondeur (face latérale)
  ctx.fillStyle = bodyD;
  ctx.beginPath();
  ctx.moveTo(x + w, y + 4);
  ctx.lineTo(x + w + 5, y + 2);
  ctx.lineTo(x + w + 5, y + h - 2);
  ctx.lineTo(x + w, y + h);
  ctx.fill();

  // Corps face
  ctx.fillStyle = bodyD;
  ctx.fillRect(x - 1, y + 1, w + 2, h);
  ctx.fillStyle = body;
  ctx.fillRect(x, y, w, h - 1);
  ctx.fillStyle = bodyL;
  ctx.fillRect(x + 1, y + 1, 3, h - 4);
  ctx.fillRect(x + 1, y + 1, w - 2, 2);

  // Corners protectors
  ctx.fillStyle = isOrange ? '#3a2010' : '#3a3428';
  ctx.fillRect(x, y, 4, 4);
  ctx.fillRect(x + w - 4, y, 4, 4);
  ctx.fillRect(x, y + h - 5, 4, 4);
  ctx.fillRect(x + w - 4, y + h - 5, 4, 4);

  // Grille tissu 4x12
  ctx.fillStyle = grill;
  ctx.fillRect(x + 4, y + 6, w - 8, h - 12);
  ctx.fillStyle = isOrange ? '#1a1008' : '#0a0806';
  ctx.fillRect(x + 5, y + 7, w - 10, h - 14);

  // 4 speakers
  const cells = [[0, 0], [1, 0], [0, 1], [1, 1]];
  for (const [cx, cy] of cells) {
    const sx = x + 7 + cx * 9;
    const sy = y + 9 + cy * 9;
    ctx.fillStyle = '#0a0806';
    oval(sx + 3.5, sy + 3.5, 4, 4, 0);
    ctx.fillStyle = isOrange ? '#4a2818' : '#2a2820';
    oval(sx + 3.5, sy + 3.5, 3, 3, 0);
    ctx.fillStyle = isOrange ? '#8a4820' : '#4a4840';
    oval(sx + 3.5, sy + 3.5, 1.6, 1.6, 0);
    ctx.fillStyle = '#1a1810';
    oval(sx + 3.5, sy + 3.5, 0.7, 0.7, 0);
    // Highlight speaker
    ctx.fillStyle = 'rgba(255,220,180,0.15)';
    oval(sx + 2.5, sy + 2.2, 1.2, 1, 0);
  }

  // Badge logo
  ctx.fillStyle = badge;
  ctx.fillRect(x + 8, y + 2, w - 16, 3);
  if (isOrange) {
    ctx.fillStyle = '#ffaa44';
    ctx.fillRect(x + 10, y + 2, w - 20, 2);
  } else {
    ctx.fillStyle = '#ffe89a';
    ctx.fillRect(x + 11, y + 2, 2, 2);
    ctx.fillRect(x + 15, y + 2, 2, 2);
  }

  // Poignée / top rail
  ctx.fillStyle = bodyD;
  ctx.fillRect(x + 6, y - 2, w - 12, 2);
}

function drawMayaTemple() {
  if (!temple) return;
  const rx = Math.round(temple.x - cam.x);
  const ry = Math.round(temple.y - cam.y);
  if (rx + temple.w < -60 || rx > VW + 60) return;

  const glow = temple.glow || 0;
  const pulse = 0.1 + Math.sin(animT * 2.4) * 0.05;

  // Glow ambiant
  if (glow > 0.05) {
    ctx.fillStyle = `rgba(200,160,80,${glow * pulse * 0.55})`;
    oval(rx + temple.w * 0.5, ry + temple.h * 0.7, 60 + glow * 20, 28, 0);
  }

  const stoneD = '#2a2418';
  const stone = '#4a4030';
  const stoneL = '#6a5a40';
  const moss = '#2a4830';
  const gold = '#c8a040';

  // Base plateforme
  ctx.fillStyle = stoneD;
  ctx.fillRect(rx - 8, ry + temple.h - 8, temple.w + 16, 10);
  ctx.fillStyle = stone;
  ctx.fillRect(rx - 6, ry + temple.h - 8, temple.w + 12, 6);

  // Degrés de pyramide (4 terrasses)
  const steps = [
    { y: 0.72, w: 1.0, h: 0.14 },
    { y: 0.52, w: 0.78, h: 0.20 },
    { y: 0.32, w: 0.56, h: 0.20 },
    { y: 0.14, w: 0.36, h: 0.18 },
  ];
  for (let si = 0; si < steps.length; si++) {
    const s = steps[si];
    const sw = temple.w * s.w;
    const sh = temple.h * s.h;
    const sx = rx + (temple.w - sw) / 2;
    const sy = ry + temple.h * s.y;
    // Face latérale (profondeur)
    ctx.fillStyle = stoneD;
    ctx.beginPath();
    ctx.moveTo(sx + sw, sy);
    ctx.lineTo(sx + sw + 6 - si, sy - 3);
    ctx.lineTo(sx + sw + 6 - si, sy + sh);
    ctx.lineTo(sx + sw, sy + sh);
    ctx.fill();
    // Face
    ctx.fillStyle = stone;
    ctx.fillRect(sx, sy, sw, sh);
    ctx.fillStyle = stoneL;
    ctx.fillRect(sx, sy, sw, 3);
    ctx.fillStyle = stoneD;
    ctx.fillRect(sx, sy + sh - 2, sw, 2);
    // Blocs
    ctx.fillStyle = 'rgba(20,16,10,0.35)';
    for (let bx = 6; bx < sw - 4; bx += 10) {
      ctx.fillRect(sx + bx, sy + 4, 1, sh - 6);
    }
    // Mousse
    ctx.fillStyle = moss;
    if (si % 2 === 0) {
      ctx.fillRect(sx + 4, sy + 2, 5, 2);
      ctx.fillRect(sx + sw - 12, sy + sh - 5, 6, 2);
    }
    // Glyphs or
    if (si === 1 || si === 2) {
      ctx.fillStyle = gold;
      const gx = sx + sw * 0.5;
      ctx.fillRect(gx - 1, sy + 6, 2, 8);
      ctx.fillRect(gx - 4, sy + 9, 8, 2);
      ctx.fillRect(gx - 3, sy + 12, 6, 1);
    }
  }

  // Escalier central
  ctx.fillStyle = stoneL;
  const stairW = 22;
  const stairX = rx + temple.w * 0.5 - stairW / 2;
  for (let i = 0; i < 10; i++) {
    const sy = ry + temple.h - 10 - i * 7;
    const inset = i * 0.3;
    ctx.fillStyle = i % 2 ? stone : stoneL;
    ctx.fillRect(stairX + inset, sy, stairW - inset * 2, 6);
    ctx.fillStyle = stoneD;
    ctx.fillRect(stairX + inset, sy + 5, stairW - inset * 2, 1);
  }

  // Temple sommet (maison)
  const topW = temple.w * 0.28;
  const topH = temple.h * 0.22;
  const topX = rx + (temple.w - topW) / 2;
  const topY = ry + temple.h * 0.02;
  ctx.fillStyle = stoneD;
  ctx.fillRect(topX - 2, topY, topW + 4, topH + 4);
  ctx.fillStyle = stone;
  ctx.fillRect(topX, topY, topW, topH);
  ctx.fillStyle = stoneL;
  ctx.fillRect(topX, topY, topW, 3);
  // Linteau / toit
  ctx.fillStyle = stoneD;
  ctx.fillRect(topX - 4, topY - 4, topW + 8, 5);
  ctx.fillStyle = gold;
  ctx.fillRect(topX + topW * 0.3, topY - 3, topW * 0.4, 2);
  // Ouverture sommet
  ctx.fillStyle = '#0a0804';
  ctx.fillRect(topX + topW * 0.3, topY + 8, topW * 0.4, topH - 12);

  // Porte / seuil bas (entrée)
  const doorW = 22;
  const doorH = 28;
  const doorX = rx + temple.w * 0.5 - doorW / 2;
  const doorY = ry + temple.h - doorH - 6;
  ctx.fillStyle = '#0a1008';
  ctx.fillRect(doorX, doorY, doorW, doorH);
  // Encadrement maya
  ctx.fillStyle = gold;
  ctx.fillRect(doorX - 3, doorY - 4, doorW + 6, 4);
  ctx.fillRect(doorX - 3, doorY, 3, doorH);
  ctx.fillRect(doorX + doorW, doorY, 3, doorH);
  // Serpent / glyphe
  ctx.fillStyle = moss;
  ctx.fillRect(doorX - 2, doorY + 6, 2, 12);
  ctx.fillRect(doorX + doorW, doorY + 6, 2, 12);

  if (glow > 0.15) {
    ctx.fillStyle = `rgba(255,220,140,${glow * 0.55})`;
    ctx.shadowColor = gold;
    ctx.shadowBlur = 10 + glow * 14;
    ctx.fillRect(doorX + 3, doorY + 4, doorW - 6, doorH - 8);
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(74,255,138,${glow * 0.35})`;
    ctx.fillRect(doorX + 6, doorY + 8, doorW - 12, doorH - 14);
  } else {
    // Lueur passive de la porte
    const g = 0.12 + Math.sin(animT * 2) * 0.05;
    ctx.fillStyle = `rgba(200,160,64,${g})`;
    ctx.fillRect(doorX + 4, doorY + 6, doorW - 8, doorH - 12);
  }
}

function drawTemple() {
  drawMayaTemple();
}

function drawBackground() {
  const t = animT;
  const scroll = cam.x * 0.08;

  // Base songes sombre
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#05070c');
  g.addColorStop(0.4, '#0a1210');
  g.addColorStop(1, '#070a08');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  // Vagues horizontales psychédéliques (monde des songes)
  for (let band = 0; band < 7; band++) {
    const y0 = 18 + band * 28;
    const amp = 5 + (band % 3) * 2.5;
    const speed = 0.55 + band * 0.12;
    const hue = (130 + band * 28 + t * 8 + scroll * 0.2) % 360;
    ctx.beginPath();
    ctx.moveTo(-10, y0);
    for (let x = -10; x <= VW + 10; x += 4) {
      const y = y0
        + Math.sin((x + scroll * (0.6 + band * 0.15)) * 0.035 + t * speed) * amp
        + Math.sin((x * 0.02) - t * 0.4 + band) * (amp * 0.45);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(VW + 10, y0 + 22);
    ctx.lineTo(-10, y0 + 22);
    ctx.closePath();
    ctx.fillStyle = `hsla(${hue}, 42%, ${14 + band}%, ${0.07 + (band % 2) * 0.03})`;
    ctx.fill();
  }

  // Second layer — ondulations croisées plus lentes
  for (let band = 0; band < 4; band++) {
    const y0 = 40 + band * 42;
    ctx.beginPath();
    for (let x = 0; x <= VW; x += 5) {
      const y = y0 + Math.sin(x * 0.028 - t * 0.35 + band * 1.7 + scroll * 0.1) * 10;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `hsla(${160 + band * 40}, 50%, 40%, 0.08)`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Voile mystique pulsant
  const hue = 145 + Math.sin(t * 0.2) * 25;
  ctx.fillStyle = `hsla(${hue}, 35%, 22%, 0.06)`;
  ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = `hsla(${290 + Math.sin(t * 0.12) * 15}, 30%, 18%, 0.05)`;
  ctx.fillRect(0, 0, VW, VH * 0.55);

  // Anneaux occultes
  ctx.save();
  ctx.translate(VW * 0.72 - scroll * 0.25, VH * 0.26);
  ctx.strokeStyle = `rgba(100,70,130,${0.1 + Math.sin(t * 0.5) * 0.04})`;
  ctx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) {
    ctx.beginPath();
    ctx.arc(0, 0, 22 + i * 16 + Math.sin(t * 0.35 + i) * 3, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();

  // Ruines lointaines
  ctx.fillStyle = 'rgba(6,12,10,0.5)';
  const baseY = VH - 34;
  for (let i = 0; i < 8; i++) {
    const bx = ((i * 68 - scroll * 0.35) % (VW + 90)) - 45;
    const bh = 16 + (i * 9) % 30;
    ctx.fillRect(bx, baseY - bh, 14 + (i % 3) * 5, bh);
  }

  // Brume ondulante basse
  for (let i = 0; i < 6; i++) {
    const mx = ((i * 85 + t * 10 - scroll) % (VW + 120)) - 60;
    const my = VH - 38 - (i % 3) * 7 + Math.sin(t * 0.6 + i) * 4;
    ctx.fillStyle = `rgba(50,90,75,${0.06 + (i % 2) * 0.03})`;
    oval(mx, my, 55 + i * 5, 9, 0);
  }

  // Particules de songe
  for (let i = 0; i < 22; i++) {
    const sx = (i * 43 + t * 7 - scroll * 0.4) % (VW + 16) - 8;
    const sy = (i * 29 + Math.sin(t * 0.8 + i) * 24 + t * 3) % VH;
    ctx.fillStyle = `rgba(170,220,190,${0.1 + Math.sin(t * 2.2 + i) * 0.06})`;
    ctx.fillRect(sx, sy, 1 + (i % 2), 1);
  }

  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(0, VH - 20, VW, 20);
}

function drawTilePlatform(rx, ry, w, h, style) {
  const top = style === 'crumble' ? '#5a4a30' : '#3a5a44';
  const mid = style === 'crumble' ? '#3a3020' : '#1e3428';
  const dark = style === 'crumble' ? '#221810' : '#0e1a14';
  const moss = style === 'crumble' ? '#4a4030' : '#2a4838';
  const hi = style === 'crumble' ? '#7a6848' : '#4a7a58';

  ctx.fillStyle = mid;
  ctx.fillRect(rx, ry, w, h);
  // Top lip
  ctx.fillStyle = top;
  ctx.fillRect(rx, ry, w, 3);
  ctx.fillStyle = hi;
  ctx.fillRect(rx, ry, w, 1);
  // Brick rows
  for (let by = 4; by < h - 2; by += 6) {
    ctx.fillStyle = dark;
    ctx.fillRect(rx, ry + by, w, 1);
    const off = (by / 6 | 0) % 2 ? 4 : 0;
    for (let bx = off; bx < w; bx += 8) {
      ctx.fillRect(rx + bx, ry + by - 4, 1, 4);
    }
  }
  // Bottom shadow
  ctx.fillStyle = dark;
  ctx.fillRect(rx, ry + h - 2, w, 2);
  // Moss tufts on top edge only
  ctx.fillStyle = moss;
  for (let mx = 3; mx < w - 4; mx += 7) {
    const seed = ((plXSeed(rx + mx, ry) * 17) | 0) % 3;
    if (seed === 0) {
      ctx.fillRect(rx + mx, ry - 2, 3, 2);
      ctx.fillRect(rx + mx + 1, ry - 3, 1, 1);
    } else if (seed === 1) {
      ctx.fillRect(rx + mx, ry - 1, 2, 1);
    }
  }
}

function plXSeed(x, y) {
  return Math.abs(((x * 13) ^ (y * 7)) | 0);
}

function drawSpikePixel(rx, ry, w, h) {
  ctx.fillStyle = '#3a181c';
  ctx.fillRect(rx, ry + h - 3, w, 3);
  const tips = Math.max(1, Math.floor(w / 8));
  for (let i = 0; i < tips; i++) {
    const cx = rx + 4 + i * 8;
    ctx.fillStyle = '#6a3040';
    ctx.fillRect(cx - 1, ry + 4, 3, h - 6);
    ctx.fillStyle = '#8a4a5a';
    ctx.fillRect(cx, ry + 2, 1, h - 5);
    ctx.fillStyle = '#c87888';
    ctx.fillRect(cx, ry, 1, 3);
    ctx.fillStyle = '#2a1014';
    ctx.fillRect(cx - 1, ry + h - 5, 3, 2);
  }
}

function drawPlatforms() {
  for (const pl of platforms) {
    if (pl.broken) continue;
    const rx = Math.round(pl.x - cam.x), ry = Math.round(pl.y - cam.y);
    if (rx + pl.w < -20 || rx > VW + 20) continue;

    if (pl.type === 'spike') {
      drawSpikePixel(rx, ry, pl.w, pl.h);
      continue;
    }

    if (pl.type === 'crumble') {
      let shake = 0;
      let alpha = 0.7;
      if (pl.crumbling) {
        const urgency = 1 - pl.crumbleTimer / CRUMBLE_DELAY;
        shake = Math.round(Math.sin(animT * (28 + urgency * 50)) * (1 + urgency * 2));
        alpha = pl.crumbleTimer <= CRUMBLE_WARN
          ? (Math.sin(animT * 40) > 0 ? 1 : 0.35)
          : 0.5 + (pl.crumbleTimer / CRUMBLE_DELAY) * 0.35;
      }
      ctx.globalAlpha = alpha;
      drawTilePlatform(rx + shake, ry, pl.w, pl.h, 'crumble');
      // Crack lines
      ctx.fillStyle = '#1a1008';
      ctx.fillRect(rx + shake + 8, ry + 3, 1, pl.h - 4);
      ctx.fillRect(rx + shake + pl.w - 12, ry + 5, 1, pl.h - 6);
      ctx.globalAlpha = 1;
      continue;
    }

    if (pl.type === 'wall') {
      ctx.fillStyle = '#121c16';
      ctx.fillRect(rx, ry, pl.w, pl.h);
      ctx.fillStyle = '#1a2a20';
      for (let wy = 0; wy < pl.h; wy += 8) ctx.fillRect(rx + 2, ry + wy, pl.w - 4, 1);
      continue;
    }

    drawTilePlatform(rx, ry, pl.w, pl.h, 'solid');

    if (pl.type === 'gate') {
      // Cab miniature solide (passage = torpeur) — plus de croix "santé"
      const pulse = 0.15 + Math.sin(animT * 3) * 0.06;
      ctx.fillStyle = '#1a1814';
      ctx.fillRect(rx, ry, pl.w, pl.h);
      ctx.fillStyle = '#2e2a24';
      ctx.fillRect(rx + 1, ry + 1, pl.w - 2, pl.h - 2);
      ctx.fillStyle = '#0c0a08';
      ctx.fillRect(rx + 3, ry + 4, pl.w - 6, pl.h - 10);
      // Speakers 2x2 hint
      ctx.fillStyle = '#3a3428';
      ctx.fillRect(rx + 5, ry + 6, 8, 8);
      ctx.fillRect(rx + pl.w - 13, ry + 6, 8, 8);
      ctx.fillRect(rx + 5, ry + 16, 8, 8);
      ctx.fillRect(rx + pl.w - 13, ry + 16, 8, 8);
      ctx.fillStyle = '#c8a040';
      ctx.fillRect(rx + 4, ry + 2, pl.w - 8, 2);
      ctx.fillStyle = `rgba(200,160,64,${pulse})`;
      ctx.fillRect(rx + 1, ry + 1, pl.w - 2, 1);
    }
  }
}

function drawItems() {
  for (const it of items) {
    if (it.taken) continue;
    const bob = Math.sin(animT * 3 + it.bob) * 3;
    const rx = it.x - cam.x, ry = it.y - cam.y + bob;
    if (rx < -24 || rx > VW + 24) continue;
    const glow = 0.4 + Math.sin(animT * 4 + it.bob) * 0.2;

    if (it.kind === 'brume') {
      ctx.fillStyle = `rgba(106,154,170,${glow * 0.25})`;
      oval(rx + 8, ry + 8, 11, 9, 0);
      shadeOval(rx + 8, ry + 8, 7.5, 6.5, '#2a4048', COL.itemBrume, '#c0e8f0', 0);
      ctx.fillStyle = `rgba(200,240,255,${0.35 + glow * 0.3})`;
      oval(rx + 5, ry + 5, 2.5, 2, 0);
      oval(rx + 10, ry + 9, 1.8, 1.5, 0);
      // Vapeur
      ctx.fillStyle = `rgba(160,200,210,${0.2 + Math.sin(animT * 5 + it.bob) * 0.1})`;
      oval(rx + 3, ry + 1, 3, 2, 0);
      oval(rx + 12, ry + 2, 2.5, 2, 0);
    } else if (it.kind === 'kalimba') {
      ctx.fillStyle = `rgba(200,160,64,${glow * 0.22})`;
      oval(rx + 8, ry + 9, 10, 8, 0);
      // Caisse résonante
      shadeOval(rx + 8, ry + 10, 7, 5.5, '#4a3010', COL.itemKalimba, '#e8c060', 0.1);
      ctx.fillStyle = '#3a2810';
      oval(rx + 8, ry + 10, 4, 3, 0);
      // Lames
      const blades = [
        { x: 4, h: 9 }, { x: 7, h: 12 }, { x: 10, h: 10 }, { x: 13, h: 7 },
      ];
      for (const b of blades) {
        ctx.fillStyle = '#8a6820';
        ctx.fillRect(rx + b.x, ry + 12 - b.h, 2, b.h);
        ctx.fillStyle = '#ffe89a';
        ctx.fillRect(rx + b.x, ry + 12 - b.h, 1, 3);
      }
      ctx.fillStyle = '#ffe89a';
      oval(rx + 8, ry + 4, 2, 1.5, 0);
    } else {
      // Feuille de sieste
      ctx.fillStyle = `rgba(74,138,90,${glow * 0.22})`;
      oval(rx + 8, ry + 9, 10, 7, -0.3);
      ctx.save();
      ctx.translate(rx + 8, ry + 9);
      ctx.rotate(-0.35 + Math.sin(animT * 2 + it.bob) * 0.08);
      shadeOval(0, 0, 7.5, 4.5, '#1a3020', COL.itemSieste, '#8affa0', -0.1);
      ctx.fillStyle = '#2a5a38';
      ctx.fillRect(-1, -8, 2, 8);
      ctx.strokeStyle = 'rgba(20,60,30,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-5, -1); ctx.quadraticCurveTo(0, 1, 5, -1);
      ctx.stroke();
      ctx.fillStyle = '#bfffc8';
      oval(-2, -1, 1.5, 1, 0);
      ctx.restore();
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt * 60;
    pt.y += pt.vy * dt * 60;
    pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const pt of particles) {
    const alpha = Math.min(1, pt.life);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = pt.color;
    ctx.fillRect(Math.round(pt.x - cam.x), Math.round(pt.y - cam.y), pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
}

function updateHUD() {
  const spd = currentSpeed();
  const pct = Math.min(100, Math.max(0, (spd / SPEED_MAX) * 100));
  const threshPct = (SLOW_THRESH / SPEED_MAX) * 100;

  const fill = document.getElementById('hud-fill');
  const bar = document.getElementById('hud-bar');
  const thresh = document.getElementById('hud-thresh');
  fill.style.width = pct + '%';
  thresh.style.left = threshPct + '%';

  const tp = document.getElementById('hud-torpeur');
  const tpRing = document.getElementById('hud-torpeur-ring');
  const tpTime = document.getElementById('hud-torpeur-time');
  const tpLabel = document.getElementById('hud-torpeur-label');

  if (slowBuff.timer > 0) {
    fill.style.background = 'linear-gradient(to right,#2a6a5a,#6affb0)';
    const warn = slowBuff.timer <= BUFF_WARN_TIME;
    bar.classList.toggle('hud-warn', warn);

    const frac = Math.max(0, Math.min(1, slowBuff.timer / (slowBuff.timeMax || 1)));
    const deg = Math.round(frac * 360);
    const col = warn ? '#ffd84a' : (slowBuff.kind === 'kalimba' ? '#c8a040' : slowBuff.kind === 'sieste' ? '#6affb0' : '#4aff8a');
    tp.classList.add('visible');
    tp.classList.toggle('warn', warn);
    tp.style.borderColor = col;
    tpRing.style.background = `conic-gradient(${col} ${deg}deg, #1a3020 0)`;
    tpTime.textContent = slowBuff.timer.toFixed(1) + 's';
    tpTime.style.color = warn ? '#ffe89a' : '#e8ffe8';
    tpLabel.textContent = warn ? 'TORPEUR · FIN' : slowBuff.label;
    document.getElementById('hud-buff').textContent = 'Torpeur active : passages ouverts';
  } else {
    bar.classList.remove('hud-warn');
    fill.style.background = !inTorpeur()
      ? 'linear-gradient(to right,#aa5a4a,#ff6a4a)'
      : 'linear-gradient(to right,#3a8a4e,#6affb0)';
    tp.classList.remove('visible', 'warn');
    document.getElementById('hud-buff').textContent = !inTorpeur()
      ? 'TROP VITE · RELÂCHE →'
      : 'TORPEUR OK';
  }
}

function resize() {
  const scale = Math.min(window.innerWidth / VW, window.innerHeight / VH);
  canvas.style.width = (VW * scale) + 'px';
  canvas.style.height = (VH * scale) + 'px';
}

function updateGamepadVisibility() {
  const gp = document.getElementById('gamepad');
  const tutorielOpen = document.getElementById('tutoriel').style.display === 'flex';
  const blocked = narrActive || tutorielOpen
    || phase === 'fin' || phase === 'temple' || phase === 'death' || phase === 'cine';
  const show = !blocked && SlothDevice.isTouchPrimary();
  gp.classList.toggle('visible', show);
}

function setupInput() {
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') { e.preventDefault(); tryJump(); }
    if (e.code === 'KeyX') { e.preventDefault(); tryAttack(); }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  document.querySelectorAll('.gp-btn[data-key]').forEach(btn => {
    const key = btn.dataset.key;
    const down = e => { e.preventDefault(); touchKeys[key] = true; btn.classList.add('actif'); };
    const up = e => { e.preventDefault(); touchKeys[key] = false; btn.classList.remove('actif'); };
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointerleave', up);
    btn.addEventListener('pointercancel', up);
    if (key === 'jump') btn.addEventListener('pointerdown', e => { e.preventDefault(); tryJump(); });
    if (key === 'attack') btn.addEventListener('pointerdown', e => { e.preventDefault(); tryAttack(); });
  });

  updateGamepadVisibility();
  window.addEventListener('resize', updateGamepadVisibility);
}

function pollGamepad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let pad = null;
  for (const p of pads) { if (p) { pad = p; break; } }
  if (!pad) return;
  const ax = pad.axes[0] || 0;
  touchKeys.left = touchKeys.left || ax < -0.35 || pad.buttons[14]?.pressed;
  touchKeys.right = touchKeys.right || ax > 0.35 || pad.buttons[15]?.pressed;
  if (pad.buttons[0]?.pressed || pad.buttons[1]?.pressed) {
    if (!pad._jumpLatch) { pad._jumpLatch = true; tryJump(); }
  } else pad._jumpLatch = false;
  if (pad.buttons[2]?.pressed || pad.buttons[3]?.pressed) {
    if (!pad._atkLatch) { pad._atkLatch = true; tryAttack(); }
  } else pad._atkLatch = false;
}

function update(dt) {
  if (phase === 'fin') return;

  if (hitstopTimer > 0) {
    hitstopTimer -= dt;
    updateHUD();
    return;
  }

  animT += dt;
  pollGamepad();

  if (phase === 'cine') {
    updateCerberusCine(dt);
    updateParticles(dt);
    updateShockwaves(dt);
    updateHUD();
    return;
  }

  if (phase === 'death') {
    updateDeathSequence(dt);
    updateHUD();
    return;
  }

  if (attackTimer > 0) {
    attackTimer -= dt;
    distortAmt *= Math.pow(0.9, frameStep(dt));
    camShake *= Math.pow(0.82, frameStep(dt));
    attackFlash *= Math.pow(0.88, frameStep(dt));
  }
  if (attackCooldown > 0) attackCooldown -= dt;
  if (camShake > 0 && attackTimer <= 0 && !templeSeq) camShake *= Math.pow(0.9, frameStep(dt));
  updateShockwaves(dt);

  if (attackFlash > 0 && attackTimer <= 0) attackFlash -= dt;
  if (invulnTimer > 0) invulnTimer -= dt;
  if (coyoteTimer > 0 && !playerState.onGround) coyoteTimer -= dt;
  if (playerState.onGround) coyoteTimer = COYOTE_TIME;
  if (jumpBufferTimer > 0) {
    jumpBufferTimer -= dt;
    if (jumpBufferTimer > 0 && (playerState.onGround || coyoteTimer > 0 || playerState.jumps < MAX_JUMPS)) {
      doJump(playerState.onGround || coyoteTimer > 0);
    }
  }
  if (landSquash > 0) landSquash = Math.max(0, landSquash - dt * 2.8);
  playerState.bodySquash = landSquash > 0 ? 1 - landSquash * 0.35 : 1;

  if (slowBuff.timer > 0) {
    slowBuff.timer -= dt;
    if (slowBuff.timer <= 0) slowBuff = { mult: 1, timer: 0, timeMax: 0, label: '', kind: '' };
  }

  if (phase === 'intro' && !bootStarted) {
    bootStarted = true;
    snapToGround();
    startIntro();
  }

  if (templeSeq) {
    updateTempleSequence(dt);
    updateParticles(dt);
  } else if (phase === 'play' && !narrActive) {
    resolveCollisions(dt);
    updateCrumble(dt);
    updateEnemies(dt);
    updateParticles(dt);
  }

  if (templeSeq || phase === 'play') {
    updateAnim(dt);
  }

  updateCamera();
  updateHUD();
}

function updateCamera() {
  const shakeCamX = (Math.random() - 0.5) * camShake * 0.35;
  const shakeCamY = (Math.random() - 0.5) * camShake * 0.22;
  const atTemple = !!(templeSeq && (templeSeq.phase === 'meditate' || templeSeq.phase === 'ascend'));
  const wantLook = atTemple
    ? 0
    : CAM_LOOKAHEAD * (playerState.facing > 0 ? 1 : -0.35);
  camLookX += (wantLook - camLookX) * (atTemple ? 0.2 : 0.4);
  const cx = playerState.x + PW / 2 + camLookX;
  const cy = playerState.y + PH / 2;

  const targetX = cx - VW / 2 + shakeCamX;
  const targetY = cy - VH / 2 + shakeCamY;
  const dx = targetX - cam.x;
  const dy = targetY - cam.y;
  const followX = atTemple ? 0.2 : (Math.abs(dx) > 28 ? 0.4 : 0.28);
  const followY = atTemple ? 0.16 : 0.22;
  cam.x += dx * followX;
  cam.y += dy * followY;
  cam.x = Math.max(0, Math.min(cam.x, levelW - VW));
  cam.y = Math.max(-40, Math.min(cam.y, 168 - VH + 60));
}

function drawProps() {
  for (const pr of props) {
    const rx = Math.round(pr.x - cam.x), ry = Math.round(pr.y - cam.y);
    if (rx < -50 || rx > VW + 50) continue;

    if (pr.kind === 'pillar') {
      const h = 56;
      ctx.fillStyle = '#0c1410';
      ctx.fillRect(rx + 2, ry - h, 12, h);
      ctx.fillStyle = '#1a2a20';
      ctx.fillRect(rx + 3, ry - h + 2, 10, h - 2);
      ctx.fillStyle = '#2a4030';
      ctx.fillRect(rx + 4, ry - h + 4, 3, h - 8);
      ctx.fillStyle = '#3a5a44';
      ctx.fillRect(rx, ry - h - 4, 16, 5);
      ctx.fillStyle = '#4a7a58';
      ctx.fillRect(rx, ry - h - 4, 16, 1);
      ctx.fillStyle = '#243428';
      ctx.fillRect(rx, ry - 4, 16, 4);
      ctx.fillStyle = '#2a4838';
      ctx.fillRect(rx + 5, ry - 30, 4, 3);
      ctx.fillRect(rx + 8, ry - 18, 3, 2);
    } else if (pr.kind === 'vine') {
      ctx.fillStyle = '#1a3020';
      for (let i = 0; i < 5; i++) {
        const vx = rx + (i % 2) * 3;
        const vy = ry - 60 + i * 10;
        ctx.fillRect(vx, vy, 2, 12);
        ctx.fillStyle = '#2a4838';
        ctx.fillRect(vx - 2, vy + 4, 3, 2);
        ctx.fillRect(vx + 2, vy + 8, 3, 2);
        ctx.fillStyle = '#1a3020';
      }
    } else if (pr.kind === 'amp_marshall') {
      drawAmpCab(rx, ry, 'marshall');
    } else if (pr.kind === 'amp_orange') {
      drawAmpCab(rx, ry, 'orange');
    }
  }
}

function drawWindZones() {
  for (const w of windZones) {
    const rx = w.x - cam.x, ry = w.y - cam.y;
    if (rx + w.w < -20 || rx > VW + 20) continue;

    // Courants de brume ondulants (pas de cadre)
    for (let band = 0; band < 5; band++) {
      ctx.beginPath();
      const yBase = ry + 16 + band * (w.h / 6);
      for (let x = 0; x <= w.w; x += 4) {
        const y = yBase
          + Math.sin((x + animT * 50) * 0.06 + band) * 6
          + Math.sin(animT * 2.2 + band * 0.8) * 3;
        if (x === 0) ctx.moveTo(rx + x, y);
        else ctx.lineTo(rx + x, y);
      }
      ctx.strokeStyle = `rgba(140,200,220,${0.12 + (band % 2) * 0.08})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Feuilles / cendres emportées
    for (let i = 0; i < 10; i++) {
      const t = animT * (28 + i * 3) + i * 40;
      const px = rx + ((t + i * 17) % (w.w + 20)) - 10;
      const py = ry + w.h * 0.25 + Math.sin(t * 0.08 + i) * (w.h * 0.35);
      const flip = Math.sin(t * 0.2) > 0;
      ctx.fillStyle = `rgba(180,220,200,${0.25 + Math.sin(animT * 4 + i) * 0.12})`;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(Math.sin(t * 0.1) * 0.8);
      oval(0, 0, flip ? 3 : 4, 1.5, 0);
      ctx.restore();
    }

    // Gusts verticaux subtils
    for (let i = 0; i < 4; i++) {
      const gx = rx + 20 + i * (w.w / 4) + Math.sin(animT * 1.5 + i) * 8;
      const gy = ry + w.h - ((animT * 35 + i * 30) % (w.h + 10));
      ctx.fillStyle = `rgba(160,210,230,${0.15})`;
      ctx.fillRect(gx, gy, 2, 10);
    }
  }
}

function drawWorldContent() {
  drawBackground();
  drawWindZones();
  drawProps();
  drawPlatforms();
  drawTemple();
  for (const e of enemies) {
    if (!e.alive) continue;
    const rx = e.x - cam.x, ry = e.y - cam.y;
    if (rx + e.w < -30 || rx > VW + 30) continue;
    drawEnemy(rx, ry, e);
  }
  drawBossProjectiles();
  drawItems();
  drawParticles();
}

function drawShockwaves() {
  if (!shockwaves.length) return;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  for (const w of shockwaves) {
    if (w.delay > 0) continue;
    const sx = Math.round(w.x - cam.x);
    const sy = Math.round(w.y - cam.y);
    const alpha = Math.min(1, w.life * w.alpha);
    const ri = Math.round(w.r);

    ctx.strokeStyle = `rgba(120,255,160,${alpha * 0.9})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(sx, sy, ri, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = `rgba(74,255,138,${alpha * 0.55})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(4, ri - 8), 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = `rgba(200,255,220,${alpha * 0.75})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(sx - ri, sy - Math.round(ri * 0.45), ri * 2, Math.max(6, Math.round(ri * 0.9)));
  }
  ctx.restore();
}

function draw() {
  if (!ctx) return;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, VW, VH);
  drawWorldContent();
  if (phase === 'cine') drawCerberusCine();

  if (phase === 'death' && deathSeq?.phase === 'dissolve') {
    const prog = Math.min(1, deathSeq.t / DEATH_SEQ.DISSOLVE);
    drawDeathSomnul(deathSeq.x - cam.x, deathSeq.y - cam.y, prog, deathSeq.facing);
    drawDeathEffects();
  } else if (phase !== 'death' || deathSeq?.phase === 'fadein') {
    drawSomnul(playerState.x - cam.x, playerState.y - cam.y);
  }

  drawShockwaves();

  if (attackFlash > 0 && phase !== 'death') {
    ctx.fillStyle = `rgba(74,255,138,${attackFlash * 0.2})`;
    ctx.fillRect(0, 0, VW, VH);
  }

  drawDeathFade();
}

let lastT = 0;
let loopStarted = false;
function loop(t) {
  requestAnimationFrame(loop);
  if (!loopStarted) {
    loopStarted = true;
    lastT = t;
    return;
  }
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;
  if (dt <= 0) return;
  update(dt);
  draw();
}

async function init() {
  if (!SlothProgress.isUnlocked(2)) {
    slothGoToMenu();
    return;
  }
  canvas = document.getElementById('game-canvas');
  ctx = canvas.getContext('2d');
  canvas.width = VW;
  canvas.height = VH;
  buildLevel();
  applyNarrSeenToTriggers();
  snapToGround();
  loadBackground();
  loadTemple();
  setupInput();
  resize();
  window.addEventListener('resize', resize);
  SlothDevSkip.mount(() => victoire());
  requestAnimationFrame(loop);
}

init();
</script>
</body>
