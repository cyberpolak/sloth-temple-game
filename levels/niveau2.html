<style>

  #hud-vitesse { color:#8ab890; font-size:8px; letter-spacing:3px; margin-bottom:3px; }
  #hud-bar { height:6px; background:#0a140c; border:1px solid #3a5a42; position:relative; }

  #hud-thresh { position:absolute; top:-1px; bottom:-1px; width:2px; background:rgba(255,216,74,0.55);

  }
  @keyframes hud-fill-warn {
    from { opacity:1; filter:brightness(1); }

  }
  #hud-buff { color:#4a6a50; font-size:8px; letter-spacing:2px; margin-top:3px; min-height:12px; }
  /* Haut gauche : ne gêne ni la vidéo ni les contrôles bas */
  #hud-torpeur { display:none; position:fixed; z-index:12;

    background:rgba(4,18,12,0.9); border:1px solid #4aff8a;
    box-shadow:0 0 10px rgba(74,255,138,0.28), inset 0 0 8px rgba(74,255,138,0.06);
    animation:torpeur-pulse 1.6s ease-in-out infinite; text-align:center; }
  #hud-torpeur.visible { display:block; }
  #hud-torpeur.warn { border-color:#ffd84a; box-shadow:0 0 14px rgba(255,216,74,0.45);
    animation:torpeur-warn 0.45s ease-in-out infinite alternate; }
  #hud-torpeur-label { color:#bfffc8; font-size:7px; letter-spacing:2px; margin-bottom:3px; }
  #hud-torpeur-row { display:flex; align-items:center; gap:6px; justify-content:center; }
  #hud-torpeur-time { color:#e8ffe8; font-size:13px; font-weight:bold; letter-spacing:1px;
    text-shadow:0 0 8px rgba(120,255,140,0.7); min-width:34px; text-align:right;
    font-variant-numeric:tabular-nums; }
  #hud-torpeur-ring { width:20px; height:20px; border-radius:50%;
    background:conic-gradient(#4aff8a var(--tp, 100%), #1a3020 0);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 6px rgba(74,255,138,0.35); }
  #hud-torpeur-ring::after { content:''; width:12px; height:12px; border-radius:50%;
    background:#07140c; border:1px solid #2a4a34; }
  @keyframes torpeur-pulse {
    0%,100% { box-shadow:0 0 14px rgba(74,255,138,0.28), inset 0 0 10px rgba(74,255,138,0.06); }
    50% { box-shadow:0 0 22px rgba(74,255,138,0.5), inset 0 0 14px rgba(74,255,138,0.12); }
  }
  @keyframes torpeur-warn {
    from { filter:brightness(1); }
    to { filter:brightness(1.25); }
  }
  #journal { position:fixed; bottom:0; left:0; right:0; z-index:12;
    background:rgba(4,12,7,0.95); border-top:2px solid #2a4a34;
    padding:14px 14px calc(10px + env(safe-area-inset-bottom)) 14px;
    color:#cfe8cf; display:none; text-align:center; }
  #journal-text { font-size:clamp(11px,2.8vw,14px); letter-spacing:1px; text-shadow:1px 1px 0 #000;

  #journal-ok { background:rgba(20,50,30,0.8); border:1px solid #3a6a48; color:#cfe8cf;

  #journal-ok:active { background:rgba(60,140,80,0.7); }
  #annonce { position:fixed; top:22%; width:100%; text-align:center; z-index:11; pointer-events:none;

    text-shadow:0 0 14px rgba(120,255,140,0.5), 2px 2px 0 #000; opacity:0; transition:opacity 0.3s; }
  #tip-stack { position:fixed; top:max(12px, env(safe-area-inset-top)); right:max(12px, env(safe-area-inset-right));

<script>
const VW = 320, VH = 240;
const GRAV = 0.42;
const GRAV_AIR = 0.34;
const TICK = 1 / 60;
const JUMP_VS = [-7.2, -6.0, -5.2];
const MAX_JUMPS = 3;
const RUN = 2.4;
const MAX_VX = 5.2;
const SLOW_THRESH = 2.35;
const SPEED_MAX = MAX_VX;
const BUFF_WARN_TIME = 1.5;
const COYOTE_TIME = 0.09;
const JUMP_BUFFER = 0.12;
const TEMPLE_SEQ = { APPROACH: 0.7, MEDITATE: 1.6, ASCEND: 1.15, BURST: 0.55 };
const ITEM_FLOAT = 24;
const PW = 26, PH = 32;
const GROUND_Y = 168;
const START = { x: 80, y: GROUND_Y - PH };
const WORLD_DEATH_Y = 420;
const CAM_LOOKAHEAD = 48;

const COL = {
  fur: '#3a3228', furL: '#5a4a38', furH: '#7a6850', furD: '#1e1812', belly: '#2a2820', bellyL: '#3a3830',
  eye: '#5aff9a', eyeGlow: '#2aff6a', claw: '#9a8868', clawL: '#c8b898', clawD: '#1a1410',
  plat: '#1a3028', platL: '#2a4a34', platMoss: '#2a4838', dream: '#1a2840', spike: '#8a4a5a',
  itemBrume: '#6a9aaa', itemKalimba: '#c8a040', itemSieste: '#4a8a5a',
  temple: '#2a3a28', glow: '#4aff8a',
  enemy: '#3a6a48', enemyD: '#1a3020', enemyEye: '#7affaa',
  cerb: '#243828', cerbL: '#3a5848', cerbH: '#5a8868', cerbD: '#121810',
  cerbEye: '#5aff9a', mist: '#6a9aaa', mistL: '#a8d8c8',
};

let canvas, ctx, cam = { x: 0, y: 0 };
let camLookX = 0;
let phase = 'intro';
let keys = {}, touchKeys = {};
let platforms = [], items = [], triggers = [], particles = [], windZones = [], enemies = [], props = [];
let slowBuff = { mult: 1, timer: 0, timeMax: 0, label: '', kind: '' };
let animT = 0, levelW = 0, narrActive = false, narrResolve = null;
let attackFlash = 0, actx = null, master = null;
let bgNormal = null, bgFlipped = null;
let templeSprite = null;
let temple = null;
let narrSeen = new Set();
let tipsSeen = new Set();
let invulnTimer = 0;
let templeSeq = null;
let savedPos = null;
let bootStarted = false;
let checkpoint = { x: START.x, y: START.y };
let coyoteTimer = 0;
let jumpBufferTimer = 0;
let hitstopTimer = 0;
let landSquash = 0;
let deathReason = '';
let musicGainEl = null;

const ATTACK = { DURATION: 0.85, RANGE: 290, COOLDOWN: 0.85, CONE: 0.28 };
const CRUMBLE_DELAY = 0.9;
const CRUMBLE_WARN = 0.45;
let attackTimer = 0;
let camShake = 0;
let distortAmt = 0;
let attackCooldown = 0;
let shockwaves = [];
let bossProjectiles = [];
const DEATH_SEQ = { DISSOLVE: 1.05, FADE_OUT: 0.45, FADE_IN: 0.45 };
let deathSeq = null;
let cerberusCine = null;
const playerState = {
  x: START.x, y: GROUND_Y - PH, vx: 0, vy: 0,
  onGround: true, jumps: 0, facing: 1,
  anim: 'idle', animFrame: 0, hitWall: 0,
  blink: 0, sleepy: false, screaming: 0,
  pipeScale: 1, pipeRot: 0, bodySquash: 1,
};

function dodo(ms) { return new Promise(r => setTimeout(r, ms)); }

function annoncer(txt, dur = 1800) {
  return new Promise(res => {
    const el = document.getElementById('annonce');
    el.textContent = txt;
    el.style.opacity = 1;
    setTimeout(() => { el.style.opacity = 0; setTimeout(res, 300); }, dur);
  });
}

function tipBubble(title, body, dur = 3400) {
  const stack = document.getElementById('tip-stack');
  const el = document.createElement('div');
  el.className = 'tip-bubble';
  el.innerHTML = `<strong>${title}</strong>${body}`;
  stack.appendChild(el);
  while (stack.children.length > 4) stack.removeChild(stack.firstChild);
  setTimeout(() => {
    el.classList.add('fade-out');
    setTimeout(() => el.remove(), 380);
  }, dur);
}

function clearTipBubbles() {
  document.getElementById('tip-stack').replaceChildren();
}

function log(txt) {
  return new Promise(res => {
    narrResolve = res;
    narrActive = true;
    document.getElementById('journal-text').textContent = txt;
    document.getElementById('journal').style.display = 'block';
    updateGamepadVisibility();
  });
}

function hideLog() {
  document.getElementById('journal').style.display = 'none';
  narrActive = false;
  updateGamepadVisibility();
}

function snapToGround() {
  const p = playerState;
  p.x = START.x;
  p.y = GROUND_Y - PH;
  p.vx = 0;
  p.vy = 0;
  p.onGround = true;
  p.jumps = 0;
  p.hitWall = 0;
}

function savePlayerPos() {
  savedPos = {
    x: playerState.x, y: playerState.y,
    vx: 0, vy: 0,
  };
}

function restorePlayerPos() {
  if (!savedPos) return;
  const p = playerState;
  p.x = savedPos.x;
  p.y = savedPos.y;
  p.vx = 0;
  p.vy = 0;
  p.jumps = 0;
  p.onGround = false;
  p.vy = 0.01;
  snapPlayerToPlatforms(p);
  if (!p.onGround) {
    for (const pl of platforms) {
      if (pl.broken || pl.type === 'spike' || pl.type === 'wall' || pl.type === 'gate') continue;
      if (p.x + PW > pl.x && p.x < pl.x + pl.w && Math.abs(p.y + PH - pl.y) < 14) {
        p.y = pl.y - PH;
        p.onGround = true;
        break;
      }
    }
  }
  savedPos = null;
}

function applyNarrSeenToTriggers() {
  for (const t of triggers) {
    if (t.id === 'temple') continue;
    if (narrSeen.has(t.id) || tipsSeen.has(t.id)) t.fired = true;
  }
}

function markTriggerFired(id) {
  for (const t of triggers) {
    if (t.id === id) t.fired = true;
  }
}

document.getElementById('journal-ok').addEventListener('click', () => {
  hideLog();
  if (narrResolve) { narrResolve(); narrResolve = null; }
});

function flasher(col = '#bfffc8', op = 0.35) {
  const f = document.getElementById('flash');
  f.style.background = col;
  f.style.transition = 'none';
  f.style.opacity = op;
  requestAnimationFrame(() => {
    f.style.transition = 'opacity 0.45s';
    f.style.opacity = 0;
  });
}

function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain();
  master.gain.value = 0.45;
  master.connect(actx.destination);
}

function sonCriDoom() {
  initAudio();
  const t0 = actx.currentTime;
  [55, 82.5, 110].forEach((f, i) => {
    const o = actx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f, t0);
    o.frequency.exponentialRampToValueAtTime(f * 0.6, t0 + 0.35);
    const ws = actx.createWaveShaper();
    const n = 128, curve = new Float32Array(n);
    for (let j = 0; j < n; j++) {
      const x = j / n * 2 - 1;
      curve[j] = Math.tanh(x * 6) / Math.tanh(2);
    }
    ws.curve = curve;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.18 - i * 0.04, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
    o.connect(ws); ws.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + 0.55);
  });
  const buf = actx.createBuffer(1, actx.sampleRate * 0.15, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const noise = actx.createBufferSource();
  noise.buffer = buf;
  const nf = actx.createBiquadFilter();
  nf.type = 'lowpass'; nf.frequency.value = 400;
  const ng = actx.createGain();
  ng.gain.setValueAtTime(0.12, t0);
  ng.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
  noise.connect(nf); nf.connect(ng); ng.connect(master);
  noise.start(t0);
}

function buildLevel() {
  platforms = []; items = []; triggers = []; windZones = []; enemies = []; props = [];
  levelW = 0;

  function plat(x, y, w, h, type = 'solid') {
    const p = { x, y, w, h, type, broken: false, crumbleTimer: 0, crumbling: false };
    platforms.push(p);
    levelW = Math.max(levelW, x + w);
    return p;
  }
  function trig(x, y, w, h, id, once = true) {
    triggers.push({ x, y, w, h, id, once, fired: false });
  }
  function itemOnPlat(cx, platY, kind) {
    items.push({ x: cx - 8, y: platY - ITEM_FLOAT, kind, taken: false, bob: Math.random() * Math.PI * 2 });
  }
  function enemy(x, y, minX, maxX) {
    enemies.push({ x, y, w: 22, h: 26, minX, maxX, vx: 0.4, alive: true, phase: Math.random() * 6, type: 'fuzz' });
  }
  function prop(x, y, kind) {
    props.push({ x, y, kind });
  }
  function cerberus(x, y) {
    enemies.push({
      type: 'cerberus', x, y, w: 72, h: 52, anchorX: x,
      minX: x, maxX: x, vx: 0, alive: true, phase: 0,
      headHp: [2, 2, 2], hitFlash: 0, hurtTimer: 0,

function setSafeCheckpoint(id) {
  // Spawns fixes : hors ennemis, hors dalles instables, sur sol solide
  const spots = {
    cp_bridge: { x: 1012, y: 152 - PH }, // gauche dalle post-pont (ennemi plus à droite)
    cp_boss: { x: 2755, y: 168 - PH },   // sol d'arène, après le boss, avant le vide
  };
  const spot = spots[id];
  if (spot) {
    checkpoint = { x: spot.x, y: spot.y };
    return;
  }
  checkpoint = { x: playerState.x, y: playerState.y };
}

async function fireTrigger(id) {
  if (phase === 'fin') return;

  if (id === 'temple') {
    markTriggerFired(id);
    startTempleEntry();
    return;
  }

  if (id === 'cp_bridge' || id === 'cp_boss') {
    markTriggerFired(id);
    setSafeCheckpoint(id);
    if (!tipsSeen.has(id)) {
      tipsSeen.add(id);
      tipBubble('RITE MARQUÉ', id === 'cp_bridge'
        ? 'Le pont est franchi. La mort te ramènera ici.'
        : 'Cerbère s\'incline. Le temple te rappelle ici.', 3200);
    }
    return;
  }

  if (!NARRATIONS[id]) return;

  markTriggerFired(id);

  if (narrSeen.has(id)) {
    phase = 'play';
    if (id === 'cerberus' && !tipsSeen.has('cerberus_fight')) {
      tipsSeen.add('cerberus_fight');
      tipBubble('SEUIL DE CERBERUS', 'Deux cris doom par tête. Esquive la brume, frappe quand les gueules s\'ouvrent.', 4200);
    }
    return;
  }

  savePlayerPos();
  phase = 'narration';
  narrSeen.add(id);
  await log(NARRATIONS[id]);
  restorePlayerPos();
  invulnTimer = 1.5;
  phase = 'play';
  if (id === 'cerberus') {
    tipsSeen.add('cerberus_fight');
    tipBubble('SEUIL DE CERBERUS', 'Deux cris doom par tête. Esquive la brume, frappe quand les gueules s\'ouvrent.', 4200);
  }
}

    startY: p.y,

  };

function updateTempleSequence(dt) {
  const seq = templeSeq;
  if (!seq || !temple) return;
  const p = playerState;
  seq.t += dt;

  if (seq.phase === 'approach') {
    const prog = Math.min(1, seq.t / TEMPLE_SEQ.APPROACH);
    const e = prog * prog * (3 - 2 * prog);
    p.x = seq.startX + (seq.doorX - seq.startX) * e;
    p.y = seq.startY;
    p.anim = 'walk';
    p.animFrame += dt * 5;
    p.facing = 1;
    temple.glow = prog * 0.3;
    camShake = prog * 2;
    if (Math.random() < 0.3) {
      spawnParticles(temple.doorX, temple.doorY, COL.glow, 1);
    }
    if (prog >= 1) {
      seq.phase = 'meditate';
      seq.t = 0;
      seq.meditateAt = { x: seq.doorX, y: seq.startY };
      p.x = seq.doorX;
      p.y = seq.startY;
      p.anim = 'meditate';
      p.vx = 0;
      p.vy = 0;
    }
  } else if (seq.phase === 'meditate') {
    const prog = Math.min(1, seq.t / TEMPLE_SEQ.MEDITATE);
    const breath = Math.sin(animT * 1.6) * 0.5;
    p.x = seq.meditateAt.x;
    p.y = seq.meditateAt.y;
    p.anim = 'meditate';
    p.animFrame += dt * 1.5;
    p.pipeScale = 1;
    p.pipeRot = 0;
    temple.glow = 0.3 + prog * 0.55 + breath * 0.05;
    camShake = 1 + prog * 2;
    distortAmt = Math.max(distortAmt, prog * 0.25);
    if (!seq.announced && prog > 0.12) {
      seq.announced = true;
      annoncer('LE RITE DU SOMMEIL', 1600);
    }
    // Fumée de prière qui monte vers la porte
    if (Math.random() < 0.55 + prog * 0.4) {
      spawnParticles(
        temple.doorX + (Math.random() - 0.5) * 18,
        temple.doorY - prog * 10,
        prog > 0.5 ? COL.eye : COL.glow,
        1,
      );
    }
    if (prog >= 1) {
      seq.phase = 'ascend';
      seq.t = 0;
    }
  } else if (seq.phase === 'ascend') {
    const prog = Math.min(1, seq.t / TEMPLE_SEQ.ASCEND);
    const e = prog * prog * (3 - 2 * prog);
    // Du lotus vers la porte : lévitation + absorption
    p.x = seq.doorX + Math.sin(prog * 10) * (1 - prog) * 4;
    p.y = seq.meditateAt.y + (seq.doorY - seq.meditateAt.y - 20) * e;
    if (prog < 0.35) {
      p.anim = 'meditate';
      p.pipeScale = 1 - prog * 0.15;
    } else {
      p.anim = 'pipe';
      p.pipeScale = 0.9 - (prog - 0.35) * 1.1;
      p.pipeRot = (prog - 0.35) * Math.PI * 5;
    }
    seq.alpha = 1 - Math.max(0, (prog - 0.4) / 0.6) * 0.97;
    temple.glow = 0.85 + prog * 0.7;
    distortAmt = Math.max(distortAmt, 0.25 + prog * 0.55);
    camShake = 5 + prog * 12;
    if (Math.random() < 0.7) {
      spawnParticles(temple.doorX, temple.doorY - prog * 28, COL.glow, 2);
    }
    if (prog >= 1) {
      seq.phase = 'burst';
      seq.t = 0;
      p.pipeScale = 0.05;
      seq.alpha = 0;
    }
  } else if (seq.phase === 'burst') {
    temple.glow = 1.4 - seq.t * 2;
    camShake = Math.max(0, 22 - seq.t * 35);
    attackFlash = Math.max(attackFlash, 0.55 - seq.t * 0.8);
    if (!seq.burstDone) {
      seq.burstDone = true;
      flasher('#bfffc8', 0.65);
      spawnParticles(temple.doorX, temple.doorY - 18, COL.eye, 36);
      spawnParticles(temple.doorX, temple.doorY - 18, COL.glow, 24);
    }
    if (seq.t >= TEMPLE_SEQ.BURST) {
      templeSeq = null;
      temple.glow = 0;
      victoire();
    }
  }
}

function die(reason = 'Le rêve t\'a repris.') {
  if (phase === 'death' || phase === 'fin') return;
  deathReason = reason;
  duckMusic(0.15, 1.2);
  const p = playerState;
  flasher('#5a2038', 0.5);
  camShake = 10;

  const particles = [];
  for (let i = 0; i < 36; i++) {
    particles.push({
      x: p.x + PW * 0.15 + Math.random() * PW * 0.7,
      y: p.y + Math.random() * PH,
      vx: (Math.random() - 0.5) * 2.8,
      vy: -1.4 - Math.random() * 3.2,
      life: 0.55 + Math.random() * 0.85,
      maxLife: 1.35,
      color: Math.random() > 0.45 ? COL.glow : (Math.random() > 0.5 ? COL.eye : '#7ab890'),
      size: 1 + Math.random() * 3,
    });
  }

  deathSeq = {
    phase: 'dissolve',
    t: 0,
    fade: 0,
    x: p.x,
    y: p.y,
    facing: p.facing,
    particles,
    rings: [{ r: 6, a: 0.7 }, { r: 2, a: 0.5 }],
  };
  phase = 'death';
  updateGamepadVisibility();
}

function updateDeathSequence(dt) {
  const s = deathSeq;
  if (!s) return;

  camShake *= 0.88;

  if (s.phase === 'dissolve') {
    s.t += dt;
    for (const pt of s.particles) {
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vy -= dt * 0.35;
      pt.life -= dt;
    }
    s.particles = s.particles.filter(pt => pt.life > 0);
    for (const ring of s.rings) ring.r += dt * 38;
    if (s.t >= DEATH_SEQ.DISSOLVE) {
      s.phase = 'blackout';
      s.t = 0;
    }
  } else if (s.phase === 'blackout') {
    s.t += dt;
    s.fade = Math.min(1, s.t / DEATH_SEQ.FADE_OUT);
    if (s.t >= DEATH_SEQ.FADE_OUT) {
      resetLevel(true);
      s.phase = 'fadein';
      phase = 'death';
      s.t = 0;
    }
  } else if (s.phase === 'fadein') {
    s.t += dt;
    s.fade = Math.max(0, 1 - s.t / DEATH_SEQ.FADE_IN);
    if (s.t >= DEATH_SEQ.FADE_IN) {
      deathSeq = null;
      phase = 'play';
      touchKeys.left = false;
      touchKeys.right = false;
      touchKeys.jump = false;
      touchKeys.attack = false;
      updateGamepadVisibility();
    }
  }

  updateDeathCamera();
}

function updateDeathCamera() {
  const s = deathSeq;
  if (!s) return;
  const useStart = s.phase === 'fadein';
  const cx = (useStart ? playerState.x : s.x) + PW / 2;
  const cy = (useStart ? playerState.y : s.y) + PH / 2;
  const shake = s.phase === 'dissolve' ? (Math.random() - 0.5) * camShake * 0.3 : 0;
  cam.x = cx - VW / 2 + shake;
  cam.y = cy - VH / 2 + shake * 0.5;
  cam.x = Math.max(0, Math.min(cam.x, levelW - VW));
  cam.y = Math.max(-40, Math.min(cam.y, 168 - VH + 60));
}

function drawDeathSomnul(x, y, prog, facing) {
  const lift = -prog * 24;
  const alpha = 1 - prog * 0.94;
  const slump = prog * 0.42;
  const eyePow = Math.max(0, 1 - prog * 1.35);
  const mist = prog * 0.55;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x + PW * 0.45, y + PH + lift);
  ctx.scale(facing, 1);
  ctx.rotate(slump);

  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  oval(0, 4, 12 - prog * 8, 3, 0);

  shadeOval(-2, -18, 15.5, 18.5, COL.furD, COL.fur, COL.furL, -0.12);
  shadeOval(-7, -15, 9, 12, COL.furD, COL.belly, COL.bellyL, -0.15);

  ctx.fillStyle = COL.furD;
  oval(-4, -2, 4, 5, 0.1);
  oval(5, -1 + prog * 3, 4, 5, -0.1);

  ctx.save();
  ctx.translate(4, -22);
  ctx.rotate(0.55 + prog * 0.5);
  shadeOval(0, 6, 4, 9, COL.furD, COL.fur, COL.furL, 0);
  ctx.restore();

  ctx.save();
  ctx.translate(8, -30 + prog * 3);
  ctx.rotate(-0.2 - prog * 0.35);
  shadeOval(0, 0, 8, 7, COL.furD, COL.fur, COL.furL, 0.15);
  shadeOval(6, 2, 5.5, 3.5, COL.furD, '#4a4034', '#6a5a48', 0.1);
  ctx.fillStyle = '#060a04';
  if (eyePow > 0.15) {
    oval(0, -1, 2.5, 2.5 * eyePow, 0);
    ctx.fillStyle = COL.eye;
    ctx.globalAlpha = alpha * eyePow;
    ctx.shadowColor = COL.eyeGlow;
    ctx.shadowBlur = 6 * eyePow;
    oval(0, -1, 1.8, 1.8 * eyePow, 0);
    ctx.shadowBlur = 0;
  } else {
    ctx.fillRect(-2, -1, 5, 1);
  }
  ctx.restore();

  if (mist > 0.05) {
    ctx.globalAlpha = alpha * mist * 0.45;
    ctx.fillStyle = COL.glow;
    for (let i = 0; i < 5; i++) {
      const a = animT * 3 + i * 1.3;
      ctx.fillRect(-16 + Math.cos(a) * 10, -30 + Math.sin(a) * 8, 2, 2);
    }
  }

  ctx.restore();
}

function drawDeathEffects() {
  const s = deathSeq;
  if (!s || s.phase !== 'dissolve') return;

  const prog = Math.min(1, s.t / DEATH_SEQ.DISSOLVE);
  const cx = s.x + PW / 2 - cam.x;
  const cy = s.y + PH * 0.4 - cam.y - prog * 24;

  for (const ring of s.rings) {
    const a = ring.a * (1 - prog);
    ctx.strokeStyle = `rgba(74,255,138,${a * 0.35})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, ring.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(138,184,144,${a * 0.18})`;
    ctx.beginPath();
    ctx.arc(cx, cy, ring.r * 0.72, 0, Math.PI * 2);
    ctx.stroke();
  }

  for (const pt of s.particles) {
    const a = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = a * 0.85;
    ctx.fillRect(pt.x - cam.x, pt.y - cam.y, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;

  const vign = prog * 0.35;
  if (vign > 0.02) {
    const g = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.2, VW / 2, VH / 2, VH * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, `rgba(8,4,12,${vign})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);
  }
}

function drawDeathFade() {
  if (!deathSeq || deathSeq.fade <= 0) return;
  ctx.fillStyle = `rgba(0,0,0,${deathSeq.fade})`;
  ctx.fillRect(0, 0, VW, VH);
}

  const d = defs[it.kind];
  slowBuff = { mult: d.mult, timer: d.time, timeMax: d.time, label: d.label, kind: it.kind };
  playerState.vx *= 0.55;
  const colors = { brume: COL.itemBrume, kalimba: COL.itemKalimba, sieste: COL.itemSieste };
  flasher(colors[it.kind] || '#6a9aaa', 0.25);
  spawnParticles(it.x + 8, it.y + 8, colors[it.kind] || COL.itemBrume, 12);
  tipBubble(d.title, d.tip, 4200);
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
      life: 0.6 + Math.random() * 0.4, color, size: 2 + Math.random() * 2,
    });
  }
}

function spawnShockwaves() {
  const px = playerState.x + PW * 0.65 * playerState.facing;
  const py = playerState.y + PH * 0.38;
  shockwaves = [];
  for (let i = 0; i < 6; i++) {
    shockwaves.push({
      x: px, y: py,
      r: 6 + i * 4,
      maxR: ATTACK.RANGE * (0.55 + i * 0.12),
      life: 1,
      speed: 280 + i * 55,
      delay: i * 0.04,
      alpha: 0.85 - i * 0.1,
    });
  }
}

function updateShockwaves(dt) {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const w = shockwaves[i];
    w.delay -= dt;
    if (w.delay > 0) continue;
    w.r += w.speed * dt;
    w.life -= dt * 0.9;
    if (w.life <= 0 || w.r > w.maxR) shockwaves.splice(i, 1);
  }
}

const CERBERUS_ATK = {
  IDLE: 2.2, WINDUP: 0.62, ROAR: 0.4, LUNGE: 0.32, RECOVER: 2.6, HIT_PAUSE: 1.1,
  PATROL: 52, LUNGE_SPD: 32,
  ENRAGE_IDLE: 1.35, ENRAGE_WINDUP: 0.42, ENRAGE_RECOVER: 1.55, ENRAGE_LUNGE: 42,
};
const CERBERUS_ENRAGE_LIVES = 1.5;

function cerberusLives(e) {
  return e.headHp.reduce((s, h) => s + h, 0) / 2;
}

function cerberusEnraged(e) {
  return cerberusLives(e) <= CERBERUS_ENRAGE_LIVES;
}

function cerberusTiming(e, key) {
  const en = cerberusEnraged(e);
  if (key === 'IDLE') return en ? CERBERUS_ATK.ENRAGE_IDLE : CERBERUS_ATK.IDLE;
  if (key === 'WINDUP') return en ? CERBERUS_ATK.ENRAGE_WINDUP : CERBERUS_ATK.WINDUP;
  if (key === 'RECOVER') return en ? CERBERUS_ATK.ENRAGE_RECOVER : CERBERUS_ATK.RECOVER;
  if (key === 'LUNGE_SPD') return en ? CERBERUS_ATK.ENRAGE_LUNGE : CERBERUS_ATK.LUNGE_SPD;
  return CERBERUS_ATK[key];
}

function duckMusic(vol, dur) {
  const m = document.getElementById('musique-niveau');
  if (!m) return;
  const prev = m.volume;
  m.volume = Math.max(0.05, prev * vol);
  setTimeout(() => { m.volume = prev; }, dur * 1000);
}

function triggerHitstop(t = 0.06) {
  hitstopTimer = Math.max(hitstopTimer, t);
}

function cerberusHeadAlive(e, i) {
  return e.headHp[i] > 0;
}

function cerberusAnyHeadAlive(e) {
  return e.headHp.some(hp => hp > 0);
}

function cerberusDamageHead(e) {
  for (let i = 0; i < e.headHp.length; i++) {
    if (e.headHp[i] > 0) {
      e.headHp[i]--;
      return i;
    }
  }
  return -1;
}

function inAttackCone(cx, cy, ex, ey) {
  const dx = ex - cx;
  const dy = ey - cy;
  const dist = Math.hypot(dx, dy);
  if (dist > ATTACK.RANGE || dist < 1) return dist <= ATTACK.RANGE;
  const facing = playerState.facing;
  const nx = dx / dist;
  return nx * facing >= ATTACK.CONE;
}

function killEnemiesInRange() {
  const cx = playerState.x + PW / 2;
  const cy = playerState.y + PH / 2;
  let hit = false;
  for (const e of enemies) {
    if (!e.alive) continue;
    const ex = e.x + e.w / 2;
    const ey = e.y + e.h / 2;
    if (!inAttackCone(cx, cy, ex, ey)) continue;
    if (e.type === 'cerberus') {
      if (e.hurtTimer > 0) continue;
      const headIdx = cerberusDamageHead(e);
      if (headIdx < 0) continue;
      hit = true;
      e.hurtTimer = 0.55;
      e.hitFlash = 0.45;
      e.atkPhase = 'idle';
      e.atkTimer = CERBERUS_ATK.HIT_PAUSE;
      camShake = 10;
      triggerHitstop(0.08);
      const hx = e.x + [14, 36, 58][headIdx];
      spawnParticles(hx, e.y + 6, '#6affb0', 12);
      spawnParticles(hx, e.y + 10, COL.enemyEye, 8);
      if (cerberusEnraged(e) && !e.enrageAnnounced) {
        e.enrageAnnounced = true;
        annoncer('BRUME ENRAGÉE', 1400);
        tipBubble('CERBERUS', 'Les gueules s\'ouvrent plus vite. Esquive la brume.', 3600);
      }
      if (!cerberusAnyHeadAlive(e)) {
        e.alive = false;
        spawnParticles(e.x + e.w / 2, e.y + 10, COL.glow, 28);
        spawnParticles(e.x + e.w / 2, e.y + 10, '#4a8a5a', 18);
        flasher('#4aff8a', 0.45);
        triggerHitstop(0.18);
        startCerberusCine(e);
      }
      continue;
    }
    hit = true;
    e.alive = false;
    spawnParticles(ex, ey, COL.enemyEye, 22);
    spawnParticles(ex, ey, COL.glow, 8);
    triggerHitstop(0.05);
  }
  return hit;
}


function startCerberusCine(e) {
  cerberusCine = {
    t: 0,
    x: e.x + e.w * 0.5,
    y: e.y + e.h * 0.35,
    w: e.w,
    h: e.h,
    stage: 'collapse',
    mist: [],
  };
  for (let i = 0; i < 40; i++) {
    cerberusCine.mist.push({
      x: e.x + Math.random() * e.w,
      y: e.y + Math.random() * e.h,
      vx: (Math.random() - 0.5) * 1.2,
      vy: -0.4 - Math.random() * 1.8,
      life: 1.2 + Math.random() * 1.4,
      size: 2 + Math.random() * 4,
    });
  }
  duckMusic(0.25, 4);
  phase = 'cine';
  updateGamepadVisibility();
  camShake = 14;
  annoncer('LES TROIS GUEULES SE TAISENT', 2000);
}

async function finishCerberusCine() {
  if (!cerberusCine || cerberusCine.stage === 'done') return;
  cerberusCine.stage = 'narr';
  if (!narrSeen.has('cerberus_fall')) {
    narrSeen.add('cerberus_fall');
    await log(NARRATIONS.cerberus_fall);
  }
  cerberusCine = null;
  phase = 'play';
  tipBubble('SEUIL OUVERT', 'La pyramide appelle. Avance quand tu es prêt.', 3600);
}

function updateCerberusCine(dt) {
  const c = cerberusCine;
  if (!c) return;
  c.t += dt;
  camShake *= Math.pow(0.9, frameStep(dt));
  for (let i = c.mist.length - 1; i >= 0; i--) {
    const m = c.mist[i];
    m.x += m.vx;
    m.y += m.vy;
    m.life -= dt;
    if (m.life <= 0) c.mist.splice(i, 1);
  }
  if (c.stage === 'collapse' && c.t > 0.15 && Math.random() < 0.35) {
    spawnParticles(c.x + (Math.random() - 0.5) * 40, c.y + (Math.random() - 0.5) * 20, COL.mist, 2);
  }
  if (c.stage === 'collapse' && c.t >= 2.4) {
    c.stage = 'await_narr';
    finishCerberusCine();
  }
  // Soft camera pull toward fallen boss
  const tx = c.x - VW / 2;
  const ty = c.y - VH / 2;
  cam.x += (tx - cam.x) * 0.08;
  cam.y += (ty - cam.y) * 0.08;
  cam.x = Math.max(0, Math.min(cam.x, levelW - VW));
  cam.y = Math.max(-40, Math.min(cam.y, 168 - VH + 60));
}

function drawCerberusCine() {
  const c = cerberusCine;
  if (!c) return;
  const fade = Math.min(1, c.t / 0.4);
  const sink = Math.min(1, c.t / 2.2);
  const sx = c.x - cam.x;
  const sy = c.y - cam.y + sink * 18;
  ctx.save();
  ctx.globalAlpha = (1 - sink * 0.85) * fade;
  // Corps fantôme qui s'effondre
  shadeOval(sx, sy + 8, 28 * (1 - sink * 0.3), 14 * (1 - sink * 0.4), COL.cerbD, COL.cerb, COL.cerbL, 0);
  for (let i = 0; i < 3; i++) {
    const hx = sx - 22 + i * 22;
    const hy = sy - 16 + sink * 12 + (i === 1 ? -4 : 0);
    shadeOval(hx, hy, 8, 6, COL.cerbD, COL.cerbL, null, 0);
    ctx.fillStyle = `rgba(90,255,154,${0.35 * (1 - sink)})`;
    oval(hx - 3, hy - 1, 2, 2, 0);
    oval(hx + 3, hy - 1, 2, 2, 0);
  }
  ctx.globalAlpha = 1;
  for (const m of c.mist) {
    ctx.globalAlpha = Math.max(0, m.life * 0.5);
    ctx.fillStyle = COL.mistL;
    ctx.fillRect(Math.round(m.x - cam.x), Math.round(m.y - cam.y), m.size, m.size);
  }
  ctx.globalAlpha = 1;
  // Voile sombre
  ctx.fillStyle = `rgba(2,8,6,${0.15 + sink * 0.25})`;
  ctx.fillRect(0, 0, VW, VH);
  ctx.restore();
}

function frameStep(dt) {
  return dt / TICK;
}

function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function platformBlocksSide(p, pl) {
  if (!aabb(p.x, p.y, PW, PH, pl.x, pl.y, pl.w, pl.h)) return false;
  const feet = p.y + PH;
  const platTop = pl.y;
  const cx = p.x + PW / 2;

  // Debout sur la dalle - pas un mur
  if (Math.abs(feet - platTop) <= 10 && cx >= pl.x + 2 && cx <= pl.x + pl.w - 2) return false;

  // Monter SUR la dalle (pieds déjà au niveau du sommet) — pas collé contre la face
  if (p.vy < 0 && feet <= platTop + 8) return false;

  return true;
}

function resolveSideOverlap(p, pl) {
  // Toujours pousser vers le côté d'où vient le joueur (évite l'éjection
  // dans le vide après un clip pendant un saut contre un mur droit)
  const cx = p.x + PW / 2;
  const mid = pl.x + pl.w * 0.5;
  if (cx <= mid) {
    p.x = pl.x - PW;
    p.hitWall = 1;
    if (p.vx > 0) p.vx = 0;
  } else {
    p.x = pl.x + pl.w;
    p.hitWall = -1;
    if (p.vx < 0) p.vx = 0;
  }
}

function isLandingOn(pl, p, prevBottom) {
  if (p.vy < 0) return false;
  return prevBottom <= pl.y + 10 && p.y + PH >= pl.y - 4;
}

function snapPlayerToPlatforms(p) {
  let best = null;
  const prevBottom = p.y + PH - p.vy;
  for (const pl of platforms) {
    if (pl.broken || pl.type === 'wall' || pl.type === 'spike') continue;
    if (pl.type === 'gate' && inTorpeur()) continue;
    if (!aabb(p.x, p.y, PW, PH, pl.x, pl.y, pl.w, pl.h)) continue;

    if (isLandingOn(pl, p, prevBottom)) {
      if (!best || pl.y < best.y) best = pl;
    } else if (p.vy < 0) {
      const prevTop = p.y - p.vy;
      const cx = p.x + PW / 2;
      if (cx >= pl.x + 2 && cx <= pl.x + pl.w - 2
          && prevTop <= pl.y + pl.h + 4 && p.y <= pl.y + pl.h) {
        p.y = pl.y + pl.h;
        p.vy = 0;
      }
    }
  }
  if (best) {
    const wasAir = !p.onGround && p.vy > 1.2;
    p.y = best.y - PH;
    p.vy = 0;
    p.onGround = true;
    p.jumps = 0;
    coyoteTimer = COYOTE_TIME;
    if (wasAir) {
      landSquash = 0.28;
      spawnParticles(p.x + PW * 0.5, p.y + PH, COL.platL, 5);
    }
    return best;
  }
  return null;
}

function depenetratePlatforms(p) {
  for (const pl of platforms) {
    if (pl.broken || pl.type === 'spike' || pl.type === 'wall' || pl.type === 'gate') continue;
    if (pl.type === 'gate' && inTorpeur()) continue;
    if (!aabb(p.x, p.y, PW, PH, pl.x, pl.y, pl.w, pl.h)) continue;
    const feet = p.y + PH;
    const cx = p.x + PW / 2;
    // Déjà posé sur le dessus
    if (Math.abs(feet - pl.y) <= 10 && cx >= pl.x + 2 && cx <= pl.x + pl.w - 2) continue;
    // En train de grimper au-dessus : ne pas pousser latéralement
    if (p.vy < 0 && feet <= pl.y + 8) continue;
    resolveSideOverlap(p, pl);
  }
}

function playerOnCrumble(pl) {
  const p = playerState;
  const cx = p.x + PW / 2;
  return cx > pl.x + 4 && cx < pl.x + pl.w - 4
    && Math.abs(p.y + PH - pl.y) < 8;
}

function updateCrumble(dt) {
  const p = playerState;
  for (const pl of platforms) {
    if (pl.type !== 'crumble' || pl.broken) continue;

    if (!pl.crumbling && playerOnCrumble(pl)) {
      pl.crumbling = true;
      pl.crumbleTimer = CRUMBLE_DELAY;
      if (!tipsSeen.has('crumble')) {
        tipsSeen.add('crumble');
        tipBubble('DALLES INSTABLES', 'Ne t\'attarde pas : le rêve oublie ce qui reste trop longtemps.', 3400);
      }
    }
    if (!pl.crumbling) continue;

    const drain = slowBuff.timer > 0 ? dt * 0.38 : dt;
    pl.crumbleTimer -= drain;
    if (pl.crumbleTimer <= 0) {
      pl.broken = true;
      spawnParticles(pl.x + pl.w / 2, pl.y, COL.plat, 10);
      if (p.onGround && playerOnCrumble(pl)) p.onGround = false;
    }
  }
}

function updateEnemies(dt) {
  if (templeSeq) return;
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.type === 'cerberus') {
      updateCerberus(e, dt);
      cerberusMeleeHit(e);
      if (invulnTimer <= 0 && cerberusEngaged(e)
          && e.atkPhase === 'idle' && e.hurtTimer <= 0
          && aabb(playerState.x, playerState.y, PW, PH, e.x + 10, e.y + 22, e.w - 20, e.h - 14)) {
        die('Cerbère t\'a dévoré.');
      }
      continue;
    }
    e.phase += dt;
    e.x += e.vx * frameStep(dt);
    if (e.x < e.minX || e.x + e.w > e.maxX) e.vx *= -1;
    if (invulnTimer <= 0 && aabb(playerState.x, playerState.y, PW, PH, e.x, e.y, e.w, e.h)) {
      die('Un fuzzling t\'a touché.');
    }
  }
  updateBossProjectiles(dt);
}

function spawnCerberusMist(e, hx, headIdx) {
  const px = playerState.x + PW * 0.5;
  const py = playerState.y + PH * 0.55;
  const sx = hx;
  const sy = e.y + 16;
  const dx = px - sx;
  const dy = py - sy;
  const dist = Math.hypot(dx, dy) || 1;
  const en = cerberusEnraged(e);
  const speed = (en ? 165 : 120) + headIdx * 10;
  bossProjectiles.push({
    x: sx - 8,
    y: sy - 6,
    vx: (dx / dist) * speed,
    vy: (dy / dist) * speed,
    life: 2.8,
    w: 26,
    h: 20,
    kind: 'mist',
  });
  if (en && headIdx === 1) {
    bossProjectiles.push({
      x: sx - 8, y: sy + 4,
      vx: (dx / dist) * speed * 0.85,
      vy: (dy / dist) * speed * 0.85 + 18,
      life: 2.4, w: 20, h: 16, kind: 'mist',
    });
  }
}

function cerberusMeleeHit(e) {
  if (invulnTimer > 0 || e.atkPhase !== 'lunge' || e.atkT < 0.06) return;
  const p = playerState;
  const hx = e.x - 64;
  const hy = e.y + 6;
  if (aabb(p.x, p.y, PW, PH, hx, hy, 78, 40)) die('La charge de Cerbère.');
}

function cerberusEngaged(e) {
  const px = playerState.x + PW / 2;
  return px >= e.anchorX - 420 && px <= e.anchorX + 260;
}

function cerberusPatrol(e, dt) {
  const px = playerState.x + PW / 2;
  const target = Math.max(e.patrolMin, Math.min(e.patrolMax, px - e.w * 0.42));
  const dx = target - e.x;
  if (Math.abs(dx) > 0.5) {
    const step = Math.sign(dx) * Math.min(Math.abs(dx), CERBERUS_ATK.PATROL * dt);
    e.x += step;
    e.moveDir = Math.sign(dx);
  } else {
    e.moveDir = 0;
  }
}

function updateCerberus(e, dt) {
  if (!cerberusEngaged(e)) {
    e.x += (e.anchorX - e.x) * Math.min(1, dt * 1.5);
    e.atkPhase = 'idle';
    e.atkTimer = Math.max(e.atkTimer, cerberusTiming(e, 'IDLE') * 0.5);
    e.atkT = 0;
    return;
  }
  e.phase += dt;
  e.hitFlash = Math.max(0, e.hitFlash - dt);
  e.hurtTimer = Math.max(0, e.hurtTimer - dt);

  e.atkTimer -= dt;
  if (e.atkPhase === 'idle') cerberusPatrol(e, dt);

  if (e.atkPhase === 'idle' && e.atkTimer <= 0) {
    e.atkPhase = 'windup';
    e.atkT = 0;
  }
  if (e.atkPhase === 'windup') {
    e.atkT += dt;
    if (e.atkT >= cerberusTiming(e, 'WINDUP')) {
      e.atkPhase = 'roar';
      e.atkT = 0;
      camShake = cerberusEnraged(e) ? 7 : 4;
      const heads = [e.x + 14, e.x + 36, e.x + 58];
      heads.forEach((hx, i) => {
        if (!cerberusHeadAlive(e, i)) return;
        spawnCerberusMist(e, hx, i);
      });
      spawnParticles(e.x + e.w / 2, e.y + 10, COL.mist, 10);
    }
  } else if (e.atkPhase === 'roar') {
    e.atkT += dt;
    e.moveDir = -1;
    if (Math.random() < (cerberusEnraged(e) ? 0.7 : 0.4)) {
      spawnParticles(e.x + 10 + Math.random() * 50, e.y + 8 + Math.random() * 16, COL.mist, 2);
    }
    if (e.atkT >= CERBERUS_ATK.ROAR) {
      e.atkPhase = 'lunge';
      e.atkT = 0;
    }
  } else if (e.atkPhase === 'lunge') {
    e.atkT += dt;
    e.x -= dt * cerberusTiming(e, 'LUNGE_SPD');
    e.moveDir = -1;
    if (e.atkT >= CERBERUS_ATK.LUNGE) {
      e.x = Math.max(e.patrolMin, Math.min(e.patrolMax, e.x));
      e.atkPhase = 'idle';
      e.atkTimer = cerberusTiming(e, 'RECOVER') + Math.random() * 0.45;
    }
  }
}

function updateBossProjectiles(dt) {
  const p = playerState;
  for (let i = bossProjectiles.length - 1; i >= 0; i--) {
    const b = bossProjectiles[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.vy += 28 * dt;
    b.life -= dt;
    if (Math.random() < 0.4) {
      spawnParticles(b.x + b.w * 0.5, b.y + b.h * 0.5, COL.mist, 1);
    }
    if (b.life <= 0) { bossProjectiles.splice(i, 1); continue; }
    const pad = 6;
    if (invulnTimer <= 0 && aabb(
      p.x - pad, p.y - pad, PW + pad * 2, PH + pad * 2,
      b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2,
    )) {
      bossProjectiles.splice(i, 1);
      flasher('#6a9aaa', 0.35);
      die('Brume de Cerbère.');
    }
  }
}

function tryAttack() {
  if (phase !== 'play' || narrActive || attackTimer > 0 || attackCooldown > 0) return;
  initAudio();
  sonCriDoom();
  attackTimer = ATTACK.DURATION;
  distortAmt = 1;
  camShake = 10;
  attackCooldown = ATTACK.COOLDOWN;
  playerState.anim = 'attack';
  spawnShockwaves();
  killEnemiesInRange();
  flasher('#4aff8a', 0.4);
  for (let i = 0; i < 18; i++) {
    particles.push({
      x: playerState.x + PW / 2,
      y: playerState.y + PH * 0.35,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 0.5 + Math.random() * 0.4,
      color: i % 2 ? COL.glow : COL.eye,
      size: 2 + Math.random() * 3,
    });
  }
}

function resolveCollisions(dt) {
  const p = playerState;
  const fs = frameStep(dt);
  const airborne = !p.onGround;
  p.onGround = false;
  p.hitWall = 0;

  p.vy += (airborne ? GRAV_AIR : GRAV) * fs;
  if (p.vy > 9) p.vy = 9;

  const left = touchKeys.left || keys.ArrowLeft || keys.KeyA;
  const right = touchKeys.right || keys.ArrowRight || keys.KeyD;
  const ctrl = moveControl();

  if (left) { p.vx -= RUN * ctrl * fs; p.facing = -1; }
  if (right) { p.vx += RUN * ctrl * fs; p.facing = 1; }

  p.vx *= Math.pow(0.88, fs);
  const cap = maxRunSpeed();
  if (p.vx > cap) p.vx = cap;
  if (p.vx < -cap) p.vx = -cap;

  p.x += p.vx * fs;
  for (const pl of platforms) {
    if (pl.broken || pl.type === 'spike') continue;
    if (pl.type === 'gate' && inTorpeur()) continue;
    if (!platformBlocksSide(p, pl)) continue;
    resolveSideOverlap(p, pl);
  }

  p.y += p.vy * fs;
  const stoodPlat = snapPlayerToPlatforms(p);
  depenetratePlatforms(p);
  for (const pl of platforms) {
    if (pl.type === 'spike' && !pl.broken) {
      if (invulnTimer <= 0
          && aabb(p.x, p.y + PH * 0.5, PW, PH * 0.5, pl.x, pl.y, pl.w, pl.h)) {
        die('Les pics du rêve.');
        return;
      }
    }
  }

  for (const w of windZones) {
    if (!aabb(p.x, p.y, PW, PH, w.x, w.y, w.w, w.h)) continue;
    if (!tipsSeen.has('wind')) {
      tipsSeen.add('wind');
      tipBubble('VENT DE RÉVEIL', 'Traverse en torpeur. Trop vite, le vent te jette hors du rêve.', 3800);
    }
    if (inTorpeur()) {
      p.vx += w.force * 0.12 * fs;
      p.vy -= w.force * 0.08 * fs;
    } else {
      p.vy -= w.force * 1.55 * fs;
      p.vx += w.force * 1.1 * fs;
    }
  }

  if (p.y > WORLD_DEATH_Y) {
    die('Chute dans le vide onirique.');
    return;
  }

  if (!tipsSeen.has('brake') && p.x > 1180 && p.x < 1320) {
    tipsSeen.add('brake');
    tipBubble(
      'PASSAGES DU RÊVE',
      'Marche doucement, ou prends une relique. Trop vite, les cabs te refusent.',
      4000,
    );
  }

  if (stoodPlat && stoodPlat.type === 'gate' && inTorpeur() && !tipsSeen.has('gate')) {
    tipsSeen.add('gate');
    tipBubble(
      'PASSAGE ÉTROIT',
      'Les cabs s\'ouvrent à la torpeur. Relâche la course, ou laisse une relique t\'apaiser.',
      3800,
    );
  }

  for (const it of items) {
    if (!it.taken && aabb(p.x, p.y, PW, PH, it.x, it.y, 16, 16)) collectItem(it);
  }

  for (const t of triggers) {
    if (t.fired && t.once) continue;
    if (aabb(p.x, p.y, PW, PH, t.x, t.y, t.w, t.h)) {
      t.fired = true;
      fireTrigger(t.id);
    }
  }
}

function doJump(fromGround) {
  const p = playerState;
  if (fromGround || coyoteTimer > 0) {
    p.vy = JUMP_VS[0];
    p.onGround = false;
    p.jumps = 1;
    coyoteTimer = 0;
    jumpBufferTimer = 0;
    if (attackTimer <= 0) p.anim = 'jump';
    spawnParticles(p.x + PW * 0.6, p.y + PH, COL.claw, 4);
    return true;
  }
  if (p.jumps < MAX_JUMPS) {
    p.vy = JUMP_VS[p.jumps] || JUMP_VS[JUMP_VS.length - 1];
    p.jumps++;
    jumpBufferTimer = 0;
    if (attackTimer <= 0) p.anim = 'air';
    spawnParticles(p.x + PW * 0.6, p.y + PH * 0.5, COL.glow, 4 + p.jumps);
    return true;
  }
  return false;
}

function tryJump() {
  if (phase !== 'play' || narrActive || templeSeq) return;
  const p = playerState;
  if (!doJump(p.onGround)) jumpBufferTimer = JUMP_BUFFER;
}

function updateAnim(dt) {
  const p = playerState;
  p.sleepy = slowBuff.timer > 0;
  p.blink = (p.blink + dt) % 3;

  // Cinématique temple : l'anim est pilotée par updateTempleSequence
  if (templeSeq) {
    if (p.anim === 'meditate') p.animFrame += dt * 1.5;
    else if (p.anim === 'walk') p.animFrame += dt * 5;
    return;
  }

  if (attackTimer > 0) {
    p.anim = 'attack';
    return;
  }

  if (!p.onGround) {
    p.anim = p.vy < -1.5 ? 'jump' : p.vy > 2 ? 'fall' : 'air';
  } else if (Math.abs(p.vx) > 0.35) {
    p.anim = 'walk';
    p.animFrame += dt * (3 + Math.abs(p.vx) * 0.6);
  } else if (p.hitWall) {
    p.anim = 'wall';
  } else {
    p.anim = 'idle';
    p.animFrame += dt * 1.2;
  }
}

function getSomnulPose() {
  const p = playerState;
  const breathe = Math.sin(animT * 2.2) * 0.04;
  const idleSway = Math.sin(animT * 1.4) * 0.03;

  if (p.anim === 'attack') {
    const t = 1 - attackTimer / ATTACK.DURATION;
    const windup = Math.min(1, t * 4);
    const scream = Math.max(0, 1 - attackTimer / ATTACK.DURATION);
    return {
      bodyRot: -0.12 - windup * 0.18,
      bodyY: -2 - windup * 3,
      bodyScale: 1 + windup * 0.08,
      headRot: -0.35 - scream * 0.55,
      headY: -4 - scream * 5,
      jawOpen: 2 + scream * 8,
      armF: -1.4 - scream * 0.5,
      armB: -0.6 - scream * 0.3,
      legF: 4 + scream * 2,
      legB: -3 - scream,
      walk: 0,
      eyeGlow: 8 + scream * 12,
      mouthGlow: scream,
    };
  }

  const walk = Math.sin(p.animFrame) * (p.anim === 'walk' ? 1.4 : 0);
  const walk2 = Math.cos(p.animFrame) * (p.anim === 'walk' ? 0.8 : 0);

  if (p.anim === 'walk') {
    return {
      bodyRot: -0.08 + walk2 * 0.04,
      bodyY: Math.abs(walk) * 1.5,
      bodyScale: 1,
      headRot: walk2 * 0.06,
      headY: Math.abs(walk) * 0.8,
      jawOpen: 0,
      armF: 0.45 + walk * 0.35,
      armB: 0.75 - walk * 0.35,
      legF: walk * 3.5,
      legB: -walk * 3.5,
      walk, eyeGlow: 5, mouthGlow: 0,
    };
  }

  if (p.anim === 'jump') {
    return {
      bodyRot: -0.2, bodyY: -1, bodyScale: 1.02,
      headRot: -0.15, headY: -2, jawOpen: 1,
      armF: -1.0, armB: -0.5, legF: -4, legB: 3,
      walk: 0, eyeGlow: 6, mouthGlow: 0,
    };
  }

  if (p.anim === 'fall' || p.anim === 'air') {
    return {
      bodyRot: 0.05, bodyY: 0, bodyScale: 1,
      headRot: 0.1, headY: 1, jawOpen: 2,
      armF: 0.9 + Math.sin(animT * 8) * 0.2,
      armB: 0.5, legF: 2, legB: -2,
      walk: 0, eyeGlow: 5, mouthGlow: 0,
    };
  }

  if (p.anim === 'wall') {
    return {
      bodyRot: 0.15, bodyY: 2, bodyScale: 0.96,
      headRot: 0.2, headY: 3, jawOpen: 3,
      armF: 0.2, armB: 1.1, legF: 2, legB: -1,
      walk: 0, eyeGlow: 7, mouthGlow: 0,
    };
  }

  if (p.anim === 'meditate') {
    const breath = Math.sin(animT * 1.6) * 0.05;
    return {
      bodyRot: 0,
      bodyY: -1 + breath * 6,
      bodyScale: 1 + breath * 0.5,
      headRot: -0.08,
      headY: -1 + breath * 3,
      jawOpen: 0,
      armF: 1.15,
      armB: 1.15,
      legF: 6,
      legB: 6,
      walk: 0,
      eyeGlow: 3,
      mouthGlow: 0,
      lotus: true,
    };
  }

  return {
    bodyRot: -0.05 + idleSway,
    bodyY: breathe * 8,
    bodyScale: 1 + breathe,
    headRot: idleSway * 2,
    headY: breathe * 4,
    jawOpen: 0,
    armF: 0.55 + Math.sin(animT * 1.8) * 0.08,
    armB: 0.85,
    legF: Math.sin(animT * 1.8) * 0.5,
    legB: -Math.sin(animT * 1.8) * 0.5,
    walk: 0, eyeGlow: 4 + (p.sleepy ? 2 : 0), mouthGlow: 0,
  };
}

function drawTorpeurAura(sx, sy) {
  if (slowBuff.timer <= 0) return;
  const frac = slowBuff.timer / (slowBuff.timeMax || 1);
  const warn = slowBuff.timer <= BUFF_WARN_TIME;
  const col = warn ? '255,216,74' : (slowBuff.kind === 'kalimba' ? '200,160,64' : '74,255,138');
  const cx = Math.round(sx + PW * 0.45);
  const cy = Math.round(sy + PH * 0.55);
  const pulse = 0.35 + Math.sin(animT * 5) * 0.12;
  ctx.save();
  ctx.strokeStyle = `rgba(${col},${0.55 + pulse * 0.3})`;
  ctx.lineWidth = 2;
  const r = 20 + (1 - frac) * 4 + Math.sin(animT * 3) * 2;
  ctx.beginPath();
  ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
  ctx.stroke();
  ctx.strokeStyle = `rgba(${col},0.18)`;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
  for (let i = 0; i < 5; i++) {
    const a = animT * 2.2 + i * 1.25;
    ctx.fillStyle = `rgba(${col},${0.5 + (i % 2) * 0.3})`;
    ctx.fillRect(Math.round(cx + Math.cos(a) * (r - 2)), Math.round(cy + Math.sin(a) * (r - 4)), 2, 2);
  }
  ctx.restore();
}

function oval(x, y, rx, ry, rot) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fill();
}

function shadeOval(x, y, rx, ry, dark, mid, lite, rot) {
  ctx.fillStyle = dark;
  oval(x + 0.6, y + 0.8, rx, ry, rot);
  ctx.fillStyle = mid;
  oval(x, y, rx * 0.92, ry * 0.9, rot);
  if (lite) {
    ctx.fillStyle = lite;
    oval(x - rx * 0.22, y - ry * 0.28, rx * 0.45, ry * 0.38, rot);
  }
}

function furTuft(x, y, len, ang, col) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.fillStyle = col;
  ctx.fillRect(0, -1, len, 2);
  ctx.fillRect(len - 1, -2, 2, 3);
  ctx.restore();
}

function drawSomnul(x, y) {
  const p = playerState;
  if (templeSeq && templeSeq.alpha <= 0.02) return;

  const dir = p.facing;
  const pose = getSomnulPose();

  ctx.save();
  if (templeSeq) ctx.globalAlpha = templeSeq.alpha;
  drawTorpeurAura(x, y);

  ctx.translate(x + PW * 0.45, y + PH);
  ctx.scale(dir * (pose.bodyScale || 1), (p.bodySquash || 1) * (pose.bodyScale || 1));

  // Ombre sol
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  oval(1, 3, 13 + Math.abs(pose.legF) * 0.15, 3.2, 0);

  ctx.save();
  ctx.translate(0, pose.bodyY);
  ctx.rotate(pose.bodyRot);

  const legB = pose.legB;
  const legF = pose.legF;

  // Fumée de méditation (avant le corps)
  if (pose.lotus) {
    for (let i = 0; i < 7; i++) {
      const rise = ((animT * 22 + i * 11) % 36);
      const sway = Math.sin(animT * 2 + i) * 3;
      const a = 0.45 - rise / 50;
      ctx.fillStyle = `rgba(120,255,160,${Math.max(0, a)})`;
      oval(-2 + sway + (i % 3) - 1, -28 - rise, 2 + (i % 2), 3, 0);
    }
  }

  // —— Pattes ——
  if (pose.lotus) {
    // Position du lotus : jambes croisées
    ctx.fillStyle = COL.furD;
    oval(-8, -1, 7, 3.5, 0.35);
    oval(8, -1, 7, 3.5, -0.35);
    ctx.fillStyle = COL.fur;
    oval(-8, -2, 5.5, 2.8, 0.35);
    oval(8, -2, 5.5, 2.8, -0.35);
    ctx.fillStyle = COL.claw;
    oval(-12, 0, 2.5, 1.5, 0.2);
    oval(12, 0, 2.5, 1.5, -0.2);
  } else {
    ctx.fillStyle = COL.furD;
    oval(-4, -2 + legB * 0.35, 4.5, 5.5, 0.15);
    oval(5, -1 + legF * 0.35, 4.5, 5.5, -0.1);
    ctx.fillStyle = COL.fur;
    oval(-4, -3 + legB * 0.35, 3.5, 4.2, 0.15);
    oval(5, -2 + legF * 0.35, 3.5, 4.2, -0.1);
    ctx.fillStyle = COL.claw;
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(-6 + i * 2, 2 + legB * 0.35, 1.5, 2.5);
      ctx.fillRect(3 + i * 2, 3 + legF * 0.35, 1.5, 2.5);
    }
    ctx.fillStyle = COL.clawL;
    ctx.fillRect(-5, 3 + legB * 0.35, 1, 1);
    ctx.fillRect(4, 4 + legF * 0.35, 1, 1);
  }

  // —— Bras (hors lotus : arrière seulement ici) ——
  if (!pose.lotus) {
    ctx.save();
    ctx.translate(-10, -16);
    ctx.rotate(pose.armB * 0.55 - 0.35);
    shadeOval(0, 8, 4, 9, COL.furD, COL.fur, COL.furL, 0.12);
    ctx.fillStyle = COL.clawD;
    oval(0, 17, 3.2, 2.4, 0);
    ctx.fillStyle = COL.claw;
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(-2 + i * 1.6, 18, 1.4, 4 + (i === 1 ? 1.5 : 0));
    }
    ctx.restore();
  }

  // —— Corps massif (volume 3D) ——
  // Silhouette externe sombre
  ctx.fillStyle = COL.furD;
  oval(-1, -17, 17, 20, -0.12);
  // Corps mid
  shadeOval(-2, -18, 15.5, 18.5, COL.furD, COL.fur, null, -0.14);
  // Highlight épaule / dos
  ctx.fillStyle = COL.furL;
  oval(-6, -26, 7, 5, -0.4);
  oval(2, -24, 5, 3.5, -0.2);
  ctx.fillStyle = COL.furH;
  oval(-7, -27, 3.5, 2.2, -0.35);
  // Ventre creux
  shadeOval(-7, -15, 9.5, 12, COL.furD, COL.belly, COL.bellyL, -0.18);
  // Plis ventre
  ctx.strokeStyle = 'rgba(20,16,12,0.45)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-12, -18); ctx.quadraticCurveTo(-4, -14, -10, -8);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-11, -12); ctx.quadraticCurveTo(-3, -10, -9, -5);
  ctx.stroke();

  // Fourrure hérissée (dos)
  const fury = p.anim === 'attack' ? 1.4 : 1;
  for (let i = 0; i < 8; i++) {
    furTuft(-14 - (i % 2), -28 + i * 3.2, 3 + (i % 3) * fury, -2.4 - i * 0.04, i % 2 ? COL.furL : COL.furH);
  }
  for (let i = 0; i < 4; i++) {
    furTuft(8 + (i % 2), -22 + i * 3, 2.5, 0.5 + i * 0.05, COL.furL);
  }

  // —— Bras avant / lotus ——
  if (pose.lotus) {
    ctx.save();
    ctx.translate(-10, -10);
    ctx.rotate(0.85);
    shadeOval(0, 5, 3.5, 6.5, COL.furD, COL.fur, COL.furL, 0);
    ctx.fillStyle = COL.claw;
    oval(0, 12, 2.5, 2, 0);
    ctx.restore();
    ctx.save();
    ctx.translate(9, -10);
    ctx.rotate(-0.85);
    shadeOval(0, 5, 3.5, 6.5, COL.furD, COL.fur, COL.furL, 0);
    ctx.fillStyle = COL.claw;
    oval(0, 12, 2.5, 2, 0);
    ctx.restore();
  } else {
    ctx.save();
    ctx.translate(5, -22);
    ctx.rotate(pose.armF * 0.7 - 0.15);
    shadeOval(1, 7, 4.5, 10, COL.furD, COL.fur, COL.furL, 0.08);
    ctx.fillStyle = COL.furD;
    oval(1, 16, 3.5, 2.5, 0);
    for (let i = 0; i < 3; i++) {
      const cx = -2 + i * 2.4;
      const clen = 7 + (i === 1 ? 3 : 0) + (p.anim === 'attack' ? 2 : 0);
      ctx.fillStyle = COL.clawD;
      ctx.beginPath();
      ctx.moveTo(cx, 17);
      ctx.lineTo(cx + 1.2, 17 + clen);
      ctx.lineTo(cx + 2.4, 17);
      ctx.fill();
      ctx.fillStyle = COL.claw;
      ctx.fillRect(cx + 0.4, 17, 1.4, clen - 1);
      ctx.fillStyle = COL.clawL;
      ctx.fillRect(cx + 0.6, 17, 0.7, 3);
    }
    ctx.restore();
  }

  // —— Tête ——
  ctx.save();
  ctx.translate(9, -30 + pose.headY);
  ctx.rotate(pose.headRot);

  // Crâne
  shadeOval(0, 0, 8.5, 7.5, COL.furD, COL.fur, COL.furL, 0.18);
  // Joues
  ctx.fillStyle = COL.furL;
  oval(-3, 2, 4, 3.5, 0.3);
  // Museau
  shadeOval(7, 2.5, 6.5, 4.2 + pose.jawOpen * 0.08, COL.furD, '#4a4034', '#6a5a48', 0.12);
  // Nez
  ctx.fillStyle = COL.clawD;
  oval(11, 1.2, 2.2, 1.6, 0.1);
  ctx.fillStyle = '#2a2218';
  oval(11.5, 1, 1.1, 0.8, 0);

  if (pose.jawOpen > 0.5) {
    const j = pose.jawOpen;
    ctx.fillStyle = '#120808';
    oval(7, 4 + j * 0.35, 5.5, 2 + j * 0.35, 0);
    ctx.fillStyle = '#3a1020';
    oval(7, 4.5 + j * 0.3, 4, 1.2 + j * 0.2, 0);
    // Dents
    ctx.fillStyle = '#e8e0d0';
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(4 + i * 2.2, 3 + j * 0.2, 1.4, 2.2);
    }
    if (pose.mouthGlow > 0) {
      ctx.fillStyle = `rgba(74,255,138,${pose.mouthGlow * 0.55})`;
      ctx.shadowColor = COL.glow;
      ctx.shadowBlur = 10;
      oval(7, 4, 3.5, 1.5 + j * 0.2, 0);
      ctx.shadowBlur = 0;
    }
  } else {
    // Bouche close
    ctx.strokeStyle = 'rgba(10,8,6,0.7)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(4, 4.5);
    ctx.quadraticCurveTo(8, 5.5, 12, 4);
    ctx.stroke();
  }

  // Sourcil / front
  ctx.fillStyle = COL.furD;
  oval(-1, -4, 5, 2.2, -0.2);

  // Oeil
  const blink = p.blink > 2.7 && p.blink < 2.85;
  const sleepy = pose.lotus || (p.sleepy && Math.sin(animT * 4) > 0.3);
  ctx.fillStyle = '#060a04';
  if (sleepy || blink) {
    ctx.fillRect(-2, -2, 6, 1.5);
    ctx.strokeStyle = COL.furD;
    ctx.beginPath();
    ctx.moveTo(-2, -1); ctx.lineTo(4, -1);
    ctx.stroke();
  } else {
    // Orbite
    oval(0.5, -1, 3.4, 3.2, 0);
    ctx.fillStyle = COL.eye;
    ctx.shadowColor = COL.eyeGlow;
    ctx.shadowBlur = pose.eyeGlow;
    oval(0.5, -1, 2.4, 2.3, 0);
    ctx.fillStyle = '#c8ffe0';
    oval(-0.2, -1.8, 0.9, 0.9, 0);
    ctx.fillStyle = '#061208';
    oval(1.1, -0.6, 1.1, 1.4, 0);
    ctx.fillStyle = '#fff';
    oval(-0.5, -2, 0.5, 0.5, 0);
    ctx.shadowBlur = 0;
    if (p.anim === 'attack') {
      ctx.fillStyle = 'rgba(74,255,138,0.35)';
      ctx.shadowColor = COL.glow;
      ctx.shadowBlur = 14;
      oval(0.5, -1, 4, 4, 0);
      ctx.shadowBlur = 0;
    }
  }

  // Oreille
  ctx.fillStyle = COL.furD;
  oval(-6, -5, 2.5, 3, -0.4);
  ctx.fillStyle = COL.fur;
  oval(-6, -5, 1.6, 2, -0.4);

  ctx.restore();

  // Zzz torpeur
  if (p.sleepy) {
    const za = 0.45 + Math.sin(animT * 3) * 0.2;
    ctx.fillStyle = `rgba(180,255,200,${za})`;
    ctx.font = 'bold 7px monospace';
    ctx.fillText('z', 16, -40 + Math.sin(animT * 2) * 2);
    ctx.font = 'bold 9px monospace';
    ctx.fillText('Z', 20, -48 + Math.sin(animT * 2 + 1) * 2);
  }

  ctx.restore();
  ctx.restore();
}

function drawEnemy(ex, ey, e) {
  if (e.type === 'cerberus') {
    drawCerberus(ex, ey, e);
    return;
  }
  const bob = Math.sin(e.phase * 3) * 2;
  const step = Math.sin(e.phase * 8);
  const rx = ex, ry = ey + bob;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  oval(rx + 11, ry + 25, 8, 2.2, 0);
  shadeOval(rx + 11, ry + 14, 10, 9, COL.enemyD, COL.enemy, '#4a8060', 0);
  // Touffes mousse
  ctx.fillStyle = '#4a8060';
  oval(rx + 4, ry + 8, 4, 4, -0.3);
  oval(rx + 18, ry + 8, 4, 4, 0.3);
  oval(rx + 11, ry + 5, 5, 4, 0);
  ctx.fillStyle = COL.enemyEye;
  oval(rx + 11, ry + 4, 2, 1.5, 0);
  ctx.fillStyle = '#0a140c';
  oval(rx + 7, ry + 13, 2.5, 2.2, 0);
  oval(rx + 15, ry + 13, 2.5, 2.2, 0);
  ctx.fillStyle = COL.enemyEye;
  oval(rx + 7, ry + 13, 1.3, 1.2, 0);
  oval(rx + 15, ry + 13, 1.3, 1.2, 0);
  ctx.fillStyle = '#102018';
  oval(rx + 11, ry + 18, 4, 2, 0);
  ctx.fillStyle = '#c8d8b0';
  ctx.fillRect(rx + 8, ry + 18, 1.5, 3);
  ctx.fillRect(rx + 12, ry + 18, 1.5, 3);
  ctx.fillStyle = COL.enemyD;
  oval(rx + 6, ry + 22 + step, 2.5, 2.5, 0);
  oval(rx + 16, ry + 22 - step, 2.5, 2.5, 0);
}

function drawCerberusHead(hx, hy, idx, dead, e, windup, roar) {
  const flash = e.hitFlash > 0;
  const bob = Math.sin(e.phase * 3.4 + idx * 1.35) * (dead ? 0.5 : 2.4);
  const pull = windup ? -6 - idx * 2.2 : 0;
  const jawDrop = roar ? 5 + Math.sin(animT * 36 + idx) * 2.5 : 0;
  const y = hy + bob + (dead ? 10 : 0) + pull;
  const x = hx + (idx === 1 ? 1 : 0);
  const scale = idx === 1 ? 1.08 : 1;

  const C = flash
    ? { a: '#e8ffe0', b: '#b8f0c0', c: '#7affaa', d: '#1a4028', e: '#fff', sn: '#d0ffd8', eye: '#fff' }
    : dead
      ? { a: '#1a2014', b: '#12160e', c: '#24281c', d: '#0c1008', e: '#2a3020', sn: '#181c14', eye: '#1a2014' }
      : { a: '#4a7058', b: '#2a4030', c: '#5a8868', d: '#1a2818', e: '#6a9a78', sn: '#3a5444', eye: COL.cerbEye };

  ctx.save();
  ctx.translate(x + 11, y + 14);
  ctx.scale(scale, scale);
  ctx.translate(-11, -14);

  // Cou cylindrique avec volume
  ctx.fillStyle = C.d;
  oval(11, 22, 7, dead ? 4 : 10, 0);
  shadeOval(11, 20, 6, dead ? 3 : 8, C.d, C.b, C.a, 0.05);
  // Tendons
  if (!dead) {
    ctx.strokeStyle = 'rgba(20,30,20,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(7, 16); ctx.lineTo(8, 28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(15, 16); ctx.lineTo(14, 28); ctx.stroke();
  }

  // Crinière / brume nuque
  ctx.fillStyle = C.d;
  oval(3, 10, 4, 7, -0.5);
  oval(19, 10, 4, 7, 0.5);
  oval(11, 4, 8, 5, 0);
  ctx.fillStyle = C.b;
  oval(4, 9, 2.5, 4, -0.5);
  oval(18, 9, 2.5, 4, 0.5);

  // Oreilles pointues
  ctx.fillStyle = C.d;
  ctx.beginPath();
  ctx.moveTo(2, 8); ctx.lineTo(0, -2); ctx.lineTo(6, 6); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(20, 8); ctx.lineTo(22, -2); ctx.lineTo(16, 6); ctx.fill();
  ctx.fillStyle = C.b;
  ctx.beginPath();
  ctx.moveTo(3, 7); ctx.lineTo(1.5, 0); ctx.lineTo(5, 6); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(19, 7); ctx.lineTo(20.5, 0); ctx.lineTo(17, 6); ctx.fill();

  // Crâne volumétrique
  shadeOval(11, 9, 9.5, 7.5, C.d, C.a, C.e, 0);
  // Arcades
  ctx.fillStyle = C.d;
  oval(7, 8, 3.5, 2.5, -0.2);
  oval(15, 8, 3.5, 2.5, 0.2);

  // Museau 3D
  shadeOval(11, 15 + jawDrop * 0.15, 7, 4.5 + jawDrop * 0.15, C.d, C.sn, C.a, 0.05);
  ctx.fillStyle = C.d;
  oval(11, 16 + jawDrop * 0.2, 3, 2, 0);
  // Narines
  ctx.fillStyle = '#0a1008';
  oval(9, 15.5, 1.2, 1, 0);
  oval(13, 15.5, 1.2, 1, 0);

  if (!dead) {
    const eyeY = 8.5;
    const glow = flash ? 16 : 8 + (roar ? 5 : 0);
    // Yeux creux
    ctx.fillStyle = '#061008';
    oval(7, eyeY, 3.2, 3, 0);
    oval(15, eyeY, 3.2, 3, 0);
    ctx.shadowColor = flash ? '#fff' : C.eye;
    ctx.shadowBlur = glow;
    ctx.fillStyle = C.eye;
    oval(7, eyeY, 2.2, 2.1, 0);
    oval(15, eyeY, 2.2, 2.1, 0);
    ctx.fillStyle = flash ? '#fff' : COL.mistL;
    oval(6.4, eyeY - 0.6, 0.9, 0.9, 0);
    oval(14.4, eyeY - 0.6, 0.9, 0.9, 0);
    ctx.fillStyle = '#041008';
    oval(7.5, eyeY + 0.3, 0.9, 1.2, 0);
    oval(15.5, eyeY + 0.3, 0.9, 1.2, 0);
    ctx.shadowBlur = 0;

    // Mâchoire / crocs
    const jy = 17 + jawDrop;
    ctx.fillStyle = '#0a1008';
    oval(11, jy + 1, 6, 2.5 + jawDrop * 0.2, 0);
    ctx.fillStyle = '#f0e8d4';
    ctx.beginPath();
    ctx.moveTo(6, jy); ctx.lineTo(7.5, jy + 5 + jawDrop * 0.3); ctx.lineTo(9, jy); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(13, jy); ctx.lineTo(14.5, jy + 5 + jawDrop * 0.3); ctx.lineTo(16, jy); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(9.5, jy); ctx.lineTo(11, jy + 3.5 + jawDrop * 0.2); ctx.lineTo(12.5, jy); ctx.fill();
    ctx.fillStyle = '#fff8e8';
    ctx.fillRect(7, jy, 1, 2);
    ctx.fillRect(14, jy, 1, 2);
    if (roar) {
      ctx.fillStyle = 'rgba(106,180,150,0.45)';
      ctx.shadowColor = COL.mist;
      ctx.shadowBlur = 8;
      oval(11, jy + 3, 8, 3, 0);
      ctx.shadowBlur = 0;
    }
  } else {
    ctx.fillStyle = '#0a1008';
    ctx.fillRect(6, 8, 10, 2);
    ctx.fillStyle = C.b;
    oval(11, 17, 4, 1.5, 0);
  }

  ctx.restore();
}

function drawCerberusAttackFx(x, y, e) {
  const en = cerberusEnraged(e);
  const aMul = en ? 1 : 0.65;

  if (e.atkPhase === 'windup') {
    const t = Math.min(1, e.atkT / CERBERUS_ATK.WINDUP);
    const pulse = 0.35 + Math.sin(animT * 22) * 0.15;
    ctx.fillStyle = `rgba(74,180,140,${pulse * t * aMul})`;
    oval(x + 36, y - 8, 28 + t * 10, 6, 0);
    ctx.strokeStyle = `rgba(106,255,180,${(0.45 + t * 0.4) * aMul})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x + 36, y + 20, 18 + t * 34, Math.PI * 0.85, Math.PI * 1.15);
    ctx.stroke();
  }

  if (e.atkPhase === 'roar') {
    const t = Math.min(1, e.atkT / CERBERUS_ATK.ROAR);
    const waveW = 50 + t * (en ? 260 : 180);
    const alpha = (0.5 - t * 0.18) * aMul;
    ctx.fillStyle = `rgba(40,100,90,${alpha})`;
    oval(x - waveW * 0.35 + 20, y + 18, waveW * 0.55, 22, 0);
    ctx.fillStyle = `rgba(120,200,170,${alpha * 0.7})`;
    oval(x - waveW * 0.3 + 20, y + 20, waveW * 0.4, 12, 0);
    ctx.strokeStyle = `rgba(180,255,220,${0.45 + Math.sin(animT * 30) * 0.2})`;
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(x + 36, y + 22, 24 + t * 80 + i * 22, Math.PI * 0.75, Math.PI * 1.25);
      ctx.stroke();
    }
  }

  if (e.atkPhase === 'lunge') {
    ctx.fillStyle = `rgba(60,140,110,${0.3 * aMul})`;
    oval(x - 36, y + 24, 40, 16, 0);
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = `rgba(180,255,210,${0.4 - i * 0.07})`;
      oval(x + 4 + i * 9, y + 40, 5, 2, 0);
    }
  }
}

function drawCerberus(sx, sy, e) {
  const hurt = e.hurtTimer > 0;
  const shake = hurt ? Math.sin(animT * 38) * 3.5 : 0;
  const lean = (e.moveDir || 0) * 4;
  const x = sx + shake + lean;
  const y = sy + Math.sin(e.phase * 2.2) * 1.4;
  const windup = e.atkPhase === 'windup';
  const roar = e.atkPhase === 'roar' || e.atkPhase === 'lunge';
  const en = cerberusEnraged(e);

  drawCerberusAttackFx(x, y, e);

  // Aura brume
  if (roar || windup || en) {
    const pulse = (roar || windup ? 0.22 : 0.1) + Math.sin(animT * 10) * 0.06;
    ctx.fillStyle = `rgba(40,100,80,${pulse})`;
    oval(x + 36, y + 22, 48, 30, 0);
    ctx.fillStyle = `rgba(100,200,160,${pulse * 0.4})`;
    oval(x + 36, y + 18, 36, 22, 0);
    for (let i = 0; i < 6; i++) {
      const a = animT * 1.5 + i;
      ctx.fillStyle = `rgba(150,220,190,${0.15 + Math.sin(a) * 0.1})`;
      oval(x + 20 + Math.cos(a) * 30, y + 10 + Math.sin(a * 1.3) * 16, 4, 3, 0);
    }
  }

  ctx.save();

  // Ombre
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  oval(x + 38, y + 52, 36, 6.5, 0);

  // Queue / brume caudale
  ctx.fillStyle = COL.cerbD;
  oval(x + 68, y + 36, 10, 5, 0.3);
  ctx.fillStyle = 'rgba(106,154,170,0.35)';
  oval(x + 74, y + 30, 8, 7, 0.4);
  oval(x + 80, y + 34, 6, 5, 0.2);
  ctx.fillStyle = 'rgba(168,216,200,0.2)';
  oval(x + 78, y + 28, 4, 4, 0);

  // Pattes arrière (perspective)
  for (const lx of [50, 60]) {
    shadeOval(x + lx, y + 44, 6, 9, COL.cerbD, COL.cerb, COL.cerbL, 0.1);
    ctx.fillStyle = COL.cerbD;
    oval(x + lx, y + 52, 5, 2.5, 0);
    ctx.fillStyle = COL.cerbH;
    ctx.fillRect(x + lx - 3, y + 52, 2, 2);
    ctx.fillRect(x + lx, y + 52, 2, 2);
    ctx.fillRect(x + lx + 3, y + 52, 2, 2);
  }

  // Torse / cage thoracique volumétrique
  shadeOval(x + 36, y + 36, 30, 16, COL.cerbD, COL.cerb, COL.cerbL, -0.05);
  // Poitrine / muscle
  ctx.fillStyle = COL.cerbL;
  oval(x + 28, y + 34, 8, 6, -0.2);
  oval(x + 44, y + 34, 8, 6, 0.2);
  // Ventre
  shadeOval(x + 36, y + 40, 16, 8, COL.cerbD, '#2a3830', '#3a5040', 0);
  // Côtes
  ctx.strokeStyle = 'rgba(90,136,104,0.55)';
  ctx.lineWidth = 1.2;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.arc(x + 36, y + 32, 10 + i * 3.5, 0.35, Math.PI - 0.35);
    ctx.stroke();
  }
  // Échine
  ctx.fillStyle = COL.cerbD;
  oval(x + 36, y + 28, 18, 4, 0);
  ctx.fillStyle = COL.cerbH;
  oval(x + 36, y + 27, 10, 2, 0);

  // Pattes avant musclées
  for (const lx of [16, 30, 44]) {
    const stomp = roar ? Math.sin(animT * 20 + lx) * 1.5 : 0;
    shadeOval(x + lx, y + 46 + stomp, 6.5, 10, COL.cerbD, COL.cerb, COL.cerbL, 0);
    ctx.fillStyle = COL.cerbD;
    oval(x + lx, y + 54 + stomp, 6, 2.8, 0);
    ctx.fillStyle = '#8aa898';
    for (let c = 0; c < 3; c++) {
      ctx.fillRect(x + lx - 3 + c * 2.5, y + 54 + stomp, 1.8, 2.5);
    }
  }

  // Colliers osseux / runes
  for (const bx of [18, 36, 54]) {
    shadeOval(x + bx, y + 27, 5, 3, '#2a3028', '#889888', '#c8d0c8', 0);
    ctx.fillStyle = '#1a2018';
    oval(x + bx, y + 27, 1.5, 1, 0);
  }
  ctx.strokeStyle = 'rgba(106,154,140,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x + 14, y + 27);
  ctx.quadraticCurveTo(x + 36, y + 24, x + 58, y + 27);
  ctx.stroke();

  // Trois têtes (centre plus haute)
  const headY = y + (windup ? 0 : 6);
  drawCerberusHead(x + 0, headY + 2, 0, !cerberusHeadAlive(e, 0), e, windup, roar);
  drawCerberusHead(x + 24, headY - 6, 1, !cerberusHeadAlive(e, 1), e, windup, roar);
  drawCerberusHead(x + 48, headY + 2, 2, !cerberusHeadAlive(e, 2), e, windup, roar);

  ctx.restore();

  // Reliques de gueule (brume / croc) — pas des croix de santé
  for (let i = 0; i < 3; i++) {
    const hp = e.headHp[i];
    const ox = x + 22 + i * 14;
    const oy = y - 16;
    if (hp <= 0) {
      ctx.fillStyle = 'rgba(20,24,18,0.7)';
      oval(ox + 4, oy + 5, 5, 4, 0);
      ctx.fillStyle = '#1a2014';
      ctx.beginPath();
      ctx.moveTo(ox + 4, oy + 2);
      ctx.lineTo(ox + 2, oy + 9);
      ctx.lineTo(ox + 6, oy + 9);
      ctx.fill();
      continue;
    }
    const weak = hp === 1;
    ctx.fillStyle = weak ? 'rgba(200,120,40,0.25)' : 'rgba(74,255,138,0.2)';
    oval(ox + 4, oy + 5, 6, 5, 0);
    ctx.fillStyle = weak ? '#e88828' : COL.mistL;
    ctx.shadowColor = weak ? '#ffaa44' : COL.glow;
    ctx.shadowBlur = 6;
    // Croc
    ctx.beginPath();
    ctx.moveTo(ox + 4, oy);
    ctx.lineTo(ox + 1, oy + 10);
    ctx.lineTo(ox + 7, oy + 10);
    ctx.fill();
    ctx.fillStyle = weak ? '#ffe0a0' : '#e8fff0';
    ctx.fillRect(ox + 3, oy + 2, 2, 4);
    ctx.shadowBlur = 0;
  }
}

function drawBossProjectiles() {
  for (const b of bossProjectiles) {
    const rx = b.x - cam.x;
    const ry = b.y - cam.y;
    if (rx + b.w < -20 || rx > VW + 20) continue;
    const pulse = 0.65 + Math.sin(animT * 18 + b.x * 0.01) * 0.25;
    ctx.fillStyle = `rgba(40,120,100,${pulse * 0.45})`;
    ctx.shadowColor = '#6affb0';
    ctx.shadowBlur = 14;
    ctx.fillRect(rx - 4, ry - 3, b.w + 8, b.h + 6);
    ctx.fillStyle = `rgba(150,220,200,${pulse})`;
    ctx.fillRect(rx, ry, b.w, b.h);
    ctx.fillStyle = `rgba(220,255,240,${pulse * 0.9})`;
    ctx.fillRect(rx + 4, ry + 4, b.w - 8, b.h - 8);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = `rgba(180,255,220,${pulse})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(rx - 1, ry - 1, b.w + 2, b.h + 2);
  }
}

function stripNearWhite(imgData) {
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    if (d[i + 3] < 8) continue;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const lum = (r + g + b) / 3;
    const sat = max - min;
    if (lum > 232 && sat < 20) {
      d[i + 3] = 0;
    } else if (lum > 205 && sat < 28) {
      d[i + 3] = Math.min(d[i + 3], Math.floor((228 - lum) * 7));
    } else if (lum > 175 && r > 168 && g > 162 && b > 155 && sat < 35) {
      d[i + 3] = Math.min(d[i + 3], Math.floor((195 - lum) * 4));
    }
  }
  return imgData;
}
